/* Layout: a fixed top command bar + a full-bleed map/analysis stage below it.
   Palette: RF-instrument dark-first - ink ground, warm "signal" amber accent,
   three CVD-separable Wi-Fi hues (secured blue / open amber / hidden teal). */
:root{
  --bg:#f5f4ef; --panel:#ffffff; --panel2:#f0eee7; --ink:#1b1d22; --ink2:#55596a; --ink3:#898ea1;
  --line:#dcdacd; --line2:#e8e6db; --accent:#c6761a; --accent-ink:#8a4f08;
  --wifi-sec:#2f74c0; --wifi-open:#d98014; --wifi-hidden:#1f9e78; --wifi-unk:#8d93a6; --ble:#7a5bd0; --lora:#c0392b;
  --good:#1f9e78; --warn:#c6761a; --crit:#c0392b; --notable:#2f74c0;
  --heat0:#e8eef7; --heat1:#a9c6e8; --heat2:#5d93cf; --heat3:#2f66ad; --heat4:#17407d;
  --rep1:#f3d08a; --rep2:#e8a33d; --rep3:#d1691a; --rep4:#a83008;
  --corr:#8e44ad; --track:#9aa0b4; --map-bg:#e7e4d8; --map-land:#f3f1e8; --map-line:#c9c6b6;
  --shadow:0 1px 3px rgba(20,22,30,.08),0 8px 24px rgba(20,22,30,.06);
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --sans:"Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  --disp:"Space Grotesk","Inter",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0c0e14; --panel:#141824; --panel2:#1b2030; --ink:#eef1f8; --ink2:#a6adc2;
  --ink3:#737a92; --line:#262c3d; --line2:#1e2434; --accent:#f0a850;
  --accent-ink:#f7c98a; --wifi-sec:#5aa0ec; --wifi-open:#f0a64e; --wifi-hidden:#35c08a; --wifi-unk:#6c738b; --ble:#a98bf0; --lora:#ef6d5a;
  --good:#35c08a; --warn:#f0a850; --crit:#ef6d5a; --notable:#5aa0ec;
  --heat0:#15233a; --heat1:#1d3f68; --heat2:#2f66ad; --heat3:#5a93d8; --heat4:#9cc3f0;
  --rep1:#6b4a1b; --rep2:#b9792a; --rep3:#e39a3f; --rep4:#f6c47a;
  --corr:#b07cd8; --track:#4a5168; --map-bg:#0a0c12; --map-land:#121724; --map-line:#2a3146;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0c0e14; --panel:#141824; --panel2:#1b2030; --ink:#eef1f8; --ink2:#a6adc2; --ink3:#737a92;
  --line:#262c3d; --line2:#1e2434; --accent:#f0a850; --accent-ink:#f7c98a;
  --wifi-sec:#5aa0ec; --wifi-open:#f0a64e; --wifi-hidden:#35c08a; --wifi-unk:#6c738b; --ble:#a98bf0; --lora:#ef6d5a;
  --good:#35c08a; --warn:#f0a850; --crit:#ef6d5a; --notable:#5aa0ec;
  --heat0:#15233a; --heat1:#1d3f68; --heat2:#2f66ad; --heat3:#5a93d8; --heat4:#9cc3f0;
  --rep1:#6b4a1b; --rep2:#b9792a; --rep3:#e39a3f; --rep4:#f6c47a;
  --corr:#b07cd8; --track:#4a5168; --map-bg:#0a0c12; --map-land:#121724; --map-line:#2a3146;
  --shadow:0 1px 3px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3{font-family:var(--disp);text-wrap:balance;margin:0;font-weight:600;letter-spacing:-.01em}
a{color:var(--accent-ink)}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {

	height: 1600px;

	}
.leaflet-marker-icon,
.leaflet-marker-shadow {

/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */

	max-height: none !important;

.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {

	max-height: none !important;

.leaflet-container img.leaflet-tile {

	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: none;
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {
	visibility: hidden;
	}


/* cursors */

.leaflet-interactive {
	cursor: pointer;
	}
.leaflet-grab {
	cursor: -webkit-grab;
	cursor:    -moz-grab;
	cursor:         grab;
	}
.leaflet-crosshair,
.leaflet-crosshair .leaflet-interactive {
	cursor: crosshair;
	}
.leaflet-popup-pane,
.leaflet-control {
	cursor: auto;
	}
.leaflet-dragging .leaflet-grab,
.leaflet-dragging .leaflet-grab .leaflet-interactive,
.leaflet-dragging .leaflet-marker-draggable {
	cursor: move;
	cursor: -webkit-grabbing;
	cursor:    -moz-grabbing;
	cursor:         grabbing;
	}

/* marker & overlays interactivity */
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {
	pointer-events: none;
	}

.leaflet-marker-icon.leaflet-interactive,
.leaflet-image-layer.leaflet-interactive,
.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}

/* visual tweaks */

.leaflet-container {
	background: #ddd;
	outline-offset: 1px;
	}
.leaflet-container a {
	color: #0078A8;
	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;

	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {

	}

	}
.leaflet-bar a.leaflet-disabled {

	}

.leaflet-touch .leaflet-bar a {

.leaflet-touch .leaflet-bar a:first-child {

	}

/* zoom control */

.leaflet-control-zoom-out {

	}

	}


/* layers control */

.leaflet-control-layers {

	}
.leaflet-control-layers-toggle {

/* popup */

.leaflet-popup {
	position: absolute;
	text-align: center;
	margin-bottom: 20px;
	}
.leaflet-popup-content-wrapper {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;

.leaflet-tooltip-right:before {

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	margin-left: -6px;
	}
.leaflet-tooltip-top:before {

	}
.leaflet-tooltip-bottom:before {

}
.leaflet-tooltip-right {
	margin-left: 6px;
}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	top: 50%;
	margin-top: -6px;
	}
.leaflet-tooltip-left:before {

	margin-right: -12px;
	border-left-color: #fff;
	}
.leaflet-tooltip-right:before {
	left: 0;
	margin-left: -12px;

	/* Prevent printers from removing background-images of controls. */

  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.topin{display:flex;align-items:center;gap:14px;max-width:1280px;margin:0 auto;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto}

  radial-gradient(circle at 60% 38%,transparent 0 46%,var(--ink3) 47% 50%,transparent 51%);
  box-shadow:inset 0 0 0 1px var(--line);flex:none}
.brand b{font-family:var(--disp);font-size:15px;letter-spacing:-.01em;display:block;line-height:1.1}
.brand span{font-size:11px;color:var(--ink3);letter-spacing:.04em}
nav{display:flex;gap:2px;flex-wrap:wrap}
nav button{font-family:var(--sans);font-size:12.5px;font-weight:500;color:var(--ink2);background:none;border:0;
  padding:7px 11px;border-radius:7px;cursor:pointer;white-space:nowrap}
nav button:hover{background:var(--panel2);color:var(--ink)}
nav button[aria-current="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] nav button[aria-current="true"],
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) nav button[aria-current="true"]{color:#1a1205}}
.themeBtn{font-family:var(--mono);font-size:11px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);
  padding:6px 9px;border-radius:7px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:22px}
.lead{font-size:14px;color:var(--ink2);max-width:62ch}
.eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--accent-ink);margin-bottom:6px}
h2.vh{font-size:clamp(22px,3.5vw,30px);margin-bottom:4px}
h3.sh{font-size:16px;margin:26px 0 12px;padding-bottom:7px;border-bottom:1px solid var(--line)}
/* ---- tiles ---- */
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px 16px;box-shadow:var(--shadow)}
.tile .k{font-family:var(--disp);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1}
.tile .l{font-size:11.5px;color:var(--ink2);margin-top:6px;line-height:1.35}
.tile .s{font-size:10.5px;color:var(--ink3);margin-top:3px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(290px,1fr));gap:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 17px;box-shadow:var(--shadow);min-width:0}
.card h4{margin:0 0 3px;font-family:var(--disp);font-size:14.5px}
.card .sub{font-size:11.5px;color:var(--ink3);margin-bottom:12px}
/* ---- bars ---- */
.bars{display:flex;flex-direction:column;gap:7px}
.bar{display:grid;grid-template-columns:176px 1fr auto;align-items:center;gap:10px;font-size:12px}
.bar .nm{color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .tk{height:11px;border-radius:3px;background:var(--accent);min-width:2px}
.bar .vl{font-family:var(--mono);font-size:11px;color:var(--ink2);white-space:nowrap}
@media(max-width:520px){.bar{grid-template-columns:128px 1fr auto;gap:7px}}
/* ---- map ---- */
#mapwrap{position:relative;height:min(76vh,740px);border:1px solid var(--line);border-radius:12px;overflow:hidden;box-shadow:var(--shadow)}
#map{position:absolute;inset:0;background:var(--map-bg)}
.leaflet-container{background:var(--map-bg);font-family:var(--sans)}
#map .leaflet-tile-pane img.leaflet-tile{filter:var(--tile-filter,none)}
.maptools{position:absolute;z-index:800;top:76px;left:10px;display:flex;flex-direction:column;gap:7px;max-width:min(270px,78%)}
.layerbox{background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);overflow:hidden}
.layerbox summary{list-style:none;cursor:pointer;padding:9px 12px;font-family:var(--disp);font-size:12.5px;font-weight:600;display:flex;align-items:center;gap:7px}
.layerbox summary::-webkit-details-marker{display:none}
.layerbox summary::before{content:"\25B8";color:var(--ink3);font-size:10px;transition:transform .15s}
.layerbox[open] summary::before{transform:rotate(90deg)}
.lyrs{padding:4px 11px 11px;display:flex;flex-direction:column;gap:3px;max-height:48vh;overflow:auto}
.lyr{display:flex;align-items:center;gap:8px;font-size:11.5px;color:var(--ink);cursor:pointer;padding:3px 2px;line-height:1.25}
.lyr input{margin:0;flex:none;accent-color:var(--accent)}
.sw{width:11px;height:11px;border-radius:3px;flex:none;border:1px solid rgba(128,128,128,.3)}
.sw.dot{border-radius:50%}
.sw.line{height:3px;border-radius:2px;width:15px}
.scan{position:absolute;z-index:800;right:10px;top:10px;display:flex;gap:6px}
.scan button{font-family:var(--mono);font-size:11px;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 9px;cursor:pointer;box-shadow:var(--shadow)}
.scan button:hover{border-color:var(--accent)}
#legend{position:absolute;z-index:800;left:10px;bottom:30px;max-width:calc(100% - 20px);background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:6px 11px;font-size:10.5px;box-shadow:var(--shadow);display:flex;flex-wrap:wrap;align-items:center;gap:3px 14px}
#legend .row{display:flex;align-items:center;gap:6px;margin:0;color:var(--ink2)}
@media(min-width:721px){#detail.on~#legend{max-width:calc(100% - 330px)}}
#detail{position:absolute;z-index:810;right:10px;bottom:30px;width:min(290px,80%);background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);padding:12px 13px;font-size:12px;display:none}
#detail.on{display:block}
#detail .x{position:absolute;right:8px;top:6px;cursor:pointer;color:var(--ink3);border:0;background:none;font-size:16px}
#detail h5{margin:0 6px 7px 0;font-family:var(--disp);font-size:13.5px;max-width:92%;word-break:break-word}
#detail dl{display:grid;grid-template-columns:auto 1fr;gap:3px 10px;margin:0}
#detail dt{color:var(--ink3);font-size:11px}
#detail dd{margin:0;font-family:var(--mono);font-size:11px;text-align:right;word-break:break-word}
.leaflet-popup-content-wrapper,.leaflet-popup-tip{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
.leaflet-popup-content{font-size:12px;margin:11px 13px;line-height:1.45}
.leaflet-popup-content b{font-family:var(--disp)}
.leaflet-bar a{background:var(--panel);color:var(--ink);border-bottom-color:var(--line)}
.leaflet-bar a:hover{background:var(--panel2)}
.lbl{font-family:var(--mono);font-size:10px;color:var(--ink2);text-shadow:0 0 3px var(--map-bg),0 0 3px var(--map-bg);white-space:nowrap;pointer-events:none;font-weight:600;letter-spacing:.02em}
.hint{font-size:11px;color:var(--ink3);margin-top:9px}
/* ---- tables ---- */
.twrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:12px;min-width:0}
th,td{text-align:left;padding:8px 11px;border-bottom:1px solid var(--line2);white-space:nowrap}
th{font-family:var(--mono);font-size:10.5px;letter-spacing:.05em;text-transform:uppercase;color:var(--ink3);position:sticky;top:0;background:var(--panel)}
td.n{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
td.w{white-space:normal;min-width:210px;line-height:1.4}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--panel2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-family:var(--mono);padding:2px 8px;border-radius:999px;border:1px solid}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.good{color:var(--good);border-color:color-mix(in srgb,var(--good) 40%,transparent)}
.pill.notable{color:var(--notable);border-color:color-mix(in srgb,var(--notable) 40%,transparent)}
.pill.warn{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 40%,transparent)}
.pill.crit{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 40%,transparent)}
.pill.expl{color:var(--ink3);border-color:var(--line)}
.finding{background:var(--panel);border:1px solid var(--line);border-left-width:3px;border-radius:10px;padding:14px 16px;box-shadow:var(--shadow);margin-bottom:12px}
.twrap+.finding{margin-top:14px}
.finding.good{border-left-color:var(--good)}
.finding.notable{border-left-color:var(--notable)}
.finding.explained{border-left-color:var(--ink3)}
.finding h4{font-family:var(--disp);font-size:15px;margin:0 0 4px;display:flex;gap:9px;align-items:baseline;flex-wrap:wrap}
.finding p{font-size:12.5px;color:var(--ink2);margin:7px 0 0}
.note{font-size:12px;color:var(--ink2);background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:12px 0}
.note b{color:var(--ink)}
.two{display:grid;grid-template-columns:1.3fr 1fr;gap:18px;align-items:start}
.two>*,.grid2>*,.keyfind>*{min-width:0}
.prose{overflow-wrap:anywhere}
@media(max-width:720px){.two{grid-template-columns:1fr}}
.swatchrow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;font-size:11px;color:var(--ink2)}
ul.clean{margin:8px 0 0;padding-left:18px;font-size:12.5px;color:var(--ink2)}
ul.clean li{margin:4px 0}
footer{padding:26px 0 30px;color:var(--ink3);font-size:11.5px;border-top:1px solid var(--line);margin-top:10px}
.spark{display:block;width:100%;height:auto}
.prose{max-width:74ch}
.prose p{font-size:14px;line-height:1.65;color:var(--ink2);margin:10px 0}
.prose p b,.prose li b{color:var(--ink);font-weight:600}
.prose ul{margin:8px 0;padding-left:20px;font-size:14px;line-height:1.6;color:var(--ink2)}
.prose li{margin:5px 0}
.prose code{font-family:var(--mono);font-size:12px;background:var(--panel2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink)}
.keyfind{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px;margin:16px 0}
.keyfind div{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:13px 15px;font-size:13px;color:var(--ink2);line-height:1.5;box-shadow:var(--shadow)}
.keyfind div b{display:block;font-family:var(--disp);font-size:14px;color:var(--ink);margin-bottom:3px}
.toc{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 4px}
.toc button{font-family:var(--mono);font-size:11px;background:var(--panel);color:var(--ink2);border:1px solid var(--line);border-radius:999px;padding:5px 11px;cursor:pointer}
.toc button:hover{border-color:var(--accent);color:var(--ink)}
.rep-sec{scroll-margin-top:84px}
.strip{font-family:var(--mono);font-size:10px;line-height:1.25;letter-spacing:0;white-space:pre;overflow-x:auto;background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:9px 11px;color:var(--ink2)}
.strip b{color:var(--accent-ink);font-weight:600}
.tag{font-family:var(--mono);font-size:10px;color:var(--ink3);border:1px solid var(--line);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:1px}
figure.chart{margin:14px 0;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:14px 16px 10px;box-shadow:var(--shadow)}
figure.chart figcaption{font-size:11.5px;color:var(--ink3);margin-top:6px}
figure.chart h4{margin:0 0 2px;font-family:var(--disp);font-size:14px}
figure.chart .sub{font-size:11.5px;color:var(--ink3);margin-bottom:10px}
.bmsel{display:flex;flex-direction:column;gap:4px;font-size:11px;color:var(--ink3);padding:2px 2px 8px;border-bottom:1px solid var(--line2);margin-bottom:6px}
.bmsel select{font-family:var(--sans);font-size:12px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
.leaflet-control-attribution{background:color-mix(in srgb,var(--panel) 88%,transparent)!important;color:var(--ink2)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--accent-ink)!important}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;margin:2px 0}
.seg button{font-family:var(--mono);font-size:11px;background:var(--panel);color:var(--ink2);border:0;padding:5px 10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:#fff}
:root[data-theme="dark"] .seg button[aria-pressed="true"]{color:#1a1205}
</style>

<div id="top"><div class="topin">
  <div class="brand"><div class="glyph"></div><div><b>Pisces Moon</b><span class="mono">SIGNALS ATLAS</span></div></div>
  <nav id="nav"></nav>
  <button class="themeBtn" id="theme">&#9680; theme</button>
</div></div>
<main id="stage"></main>

<script>"use strict";
/* Pisces Moon Signals Atlas, version 5. Runs as a published artifact (fetch) or as a local

const LOCAL=!!window.__PM_LOCAL;
const DATA='data/';

const $=(s,r=document)=>r.querySelector(s), el=(t,c,h)=>{const e=document.createElement(t);if(c)e.className=c;if(h!=null)e.innerHTML=h;return e;};
const fmt=n=>n==null?'\u2014':Number(n).toLocaleString('en-US');

const isDark=()=>{const t=document.documentElement.getAttribute('data-theme');return t?t==='dark':matchMedia('(prefers-color-scheme: dark)').matches;};
const cache={};

  if(LOCAL){if(!(f in window.__PMD))await loadScript(DATA+f.replace(/\.(json|txt)$/,'.js'));return window.__PMD[f];}

}

/* ---------- theme ---------- */
(function(){let t;try{t=localStorage.getItem('pm_theme')}catch(e){}if(t)document.documentElement.setAttribute('data-theme',t);
$('#theme').onclick=()=>{const nx=isDark()?'light':'dark';
  document.documentElement.setAttribute('data-theme',nx);try{localStorage.setItem('pm_theme',nx)}catch(e){}
  if(window.MAP)window.MAP.restyle();};})();

/* ---------- nav / routing ---------- */
const VIEWS=[['overview','Overview'],['report','Report'],['map','Map'],['signals','Signals'],['threats','Threat search'],['esp32','ESP32'],['routes','Routes & stops'],['method','Method']];
const nav=$('#nav');
VIEWS.forEach(([id,label])=>{const b=el('button',null,label);b.onclick=()=>location.hash=id;b.dataset.id=id;nav.appendChild(b);});
function route(){let h=(location.hash||'#overview').slice(1);if(!VIEWS.some(v=>v[0]===h))h='overview';
  nav.querySelectorAll('button').forEach(b=>b.setAttribute('aria-current',b.dataset.id===h));
  render(h).catch(err=>{stage.innerHTML='';stage.append(el('section',null,'<p class="lead">This view could not load its data ('+String(err.message||err)+'). Reload the page to try again.</p>'));});
  window.scrollTo(0,0);}
addEventListener('hashchange',route);

/* ---------- small chart + table helpers ---------- */
function barList(host,rows){
  const max=Math.max(1,...rows.map(r=>r.v)),box=el('div','bars');
  rows.forEach(r=>{const b=el('div','bar');b.append(el('span','nm',r.k));b.firstChild.title=r.k;
    const tk=el('span','tk');tk.style.width=(100*r.v/max)+'%';if(r.c)tk.style.background=r.c;b.append(tk);

}
const compact=v=>{const a=Math.abs(v);if(a>=1e6)return (v/1e6).toFixed(1).replace(/\.0$/,'')+'M';if(a>=1e4)return Math.round(v/1e3)+'k';return Number.isInteger(v)?fmt(v):v.toFixed(1);};

const pct=(a,b)=>b?Math.round(100*a/b):0;
const pct1=(a,b)=>b?(100*a/b).toFixed(1):'0';
const longDate=d=>{const [y,m,dd]=d.split('-').map(Number);return new Date(y,m-1,dd).toLocaleDateString('en-US',{month:'short',day:'numeric'});};
const P=(host,html)=>{const p=el('div','prose');p.innerHTML=html;host.append(p);return p;};
const DN={Mon:'Monday',Tue:'Tuesday',Wed:'Wednesday',Thu:'Thursday',Fri:'Friday',Sat:'Saturday',Sun:'Sunday'};

/* company names without the legal tail */

/* ---------- views ---------- */
const stage=$('#stage');

  if(h==='overview')return viewOverview();
  if(h==='report')return viewReport();
  if(h==='map')return viewMap();
  if(h==='signals')return viewSignals();
  if(h==='threats')return viewThreats();
  if(h==='esp32')return viewEsp32();

  <p><b>Los Angeles vs Portland.</b> LA produced ${lp.la_wifi_per_km} Wi-Fi networks per kilometer driven against ${lp.pdx_wifi_per_km} around Portland's west side (${lp.la_wifi_per_min} vs ${lp.pdx_wifi_per_min} per logged minute). The Portland driving was suburban (Beaverton, Hillsboro, Tigard), so this compares LA's core with Portland's suburbs, not city to city.</p>`);

  // 7 Wi-Fi landscape
  s=S_('wifi','7 \u00b7 The Wi-Fi landscape');
  const eero=(SEC.open_hidden_vendors.find(v=>/eero/i.test(v[0]))||[0,0])[1],c14=R.ch14,juan=c14.vendors.filter(v=>/Juan|AltoBeam/i.test(v[0])).reduce((a,v)=>a+v[1],0);
  P(s,`<p><b>What the T-Deck can hear.</b> Its radio is 2.4 GHz only. Every network here is on channels 1\u201314; 5 GHz and 6 GHz networks, which carry most traffic in a modern home, don't appear at all.</p>
  <p><b>Security, and why the earlier numbers were off.</b> Three firmware builds labeled security three different ways. The first, through April 14, wrote "WPA2" for every network, open ones included, so the ${fmt(SEC.unknown)} networks heard only in that period have no usable label. Most sessions recorded open or not open. Five sessions on May 11\u201315 recorded the actual protocol. The earlier version of this report divided across all three as if they were one.</p>
  <p>Of the <b>${fmt(SEC.known)} networks with a usable label</b>: ${fmt(SEC.secured_named)} are named and secured (${pct1(SEC.secured_named,SEC.known)}%), ${fmt(SEC.open_named)} are named and open (${pct1(SEC.open_named,SEC.known)}%), and ${fmt(SEC.hidden)} hide their name (${pct1(SEC.hidden,SEC.known)}%). A further ${fmt(SEC.open_hidden)} are both hidden and open, and ${fmt(eero)} of those are eero mesh units: each one broadcasts a second, hidden, unencrypted network for its own setup and mesh links. That isn't an open door into the home network, and it is counted under hidden.</p>
  <p>In the five sessions that recorded the protocol (${fmt(SEC.detail_n)} networks): <b>WPA2 on ${pct(SEC.wpa2,SEC.detail_n)}%</b>, WPA3 offered on <b>${pct1(SEC.wpa3_capable,SEC.detail_n)}%</b> (nearly all in WPA2/WPA3 transition mode; ${SEC.wpa3_only} are WPA3-only), old WPA still accepted alongside WPA2 on ${pct1(SEC.mixed,SEC.detail_n)}%, open ${pct1(SEC.open_detail,SEC.detail_n)}%. <b>${SEC.wep} networks still run WEP</b>, which can be broken in minutes, and ${SEC.wpa1} run first-generation WPA only.</p>
  <p><b>Open networks</b> are mostly deliberate guest and public service: ${R.open_top.filter(o=>!/_EXT|Extender/i.test(o[0])).slice(0,8).map(o=>o[0]).join(', ')}. The risky exception is factory-default range extenders left open (${ext.map(o=>o[0]+' \u00d7'+o[1]).join(', ')}), which pass traffic from the owner's home network to anyone nearby.</p>
  <p><b>Channel 14.</b> ${fmt(c14.total)} access points sat on channel 14, which no US device is licensed to use. They are not a mix: ${fmt(juan)} carry addresses registered to wireless camera makers (Guangzhou Juan and AltoBeam) and ${fmt(c14.camera_named)} have camera or recorder names. These are budget camera kits linking a recorder to its cameras on a channel nobody else is on. The earlier version filed some of them under ESP32; they are not Espressif hardware.</p>
  <p><b>ISP census.</b> Default router names give away the provider. In Los Angeles <b>${ispLA[0][0]}</b> dominates with ${fmt(ispLA[0][1])} default-named networks, ahead of ${ispLA.slice(1,4).map(i=>i[0]+' ('+fmt(i[1])+')').join(', ')}. Around Portland the mix is different: ${ispPDX.slice(0,4).map(i=>i[0]+' ('+i[2]+')').join(', ')}, and no Spectrum at all.</p>`);
  const w2=el('div','two');

  const w2b=el('div');w2b.append(table(['Provider (default name pattern)','Los Angeles','Portland'],isp.map(i=>[i[0],fmt(i[1]),fmt(i[2])]),[1,2]));w2.append(w2b);
  s.append(w2);

  // 8 vehicles
  s=S_('road','8 \u00b7 On the road with you');
  const cab=cls('rode in the cabin'),tr1=cls('intermittent'),tr2=cls('alongside'),ownc=cls('your own'),flt=cls('fleet Tesla');
  P(s,`<p>The road is one of the densest radio environments in the data. ${fmt(V.moving_wifi)} Wi-Fi access points moved more than 500 m while in range: cars, buses and phone hotspots.</p>
  <ul><li><b>${fmt(V.teslas)} distinct Teslas.</b> Each broadcasts a stable Bluetooth name derived from its VIN, so this is a count of cars. ${fmt(V.teslas_once)} were heard on one day only. The earlier figure of 3,584 missed every Tesla before May 16.</li>
  <li><b>${fmt(V.limes)} Lime scooters and e-bikes</b>, each by its own vehicle number.</li>
  <li><b>${fmt(R.gm_numbered)} GM vehicles</b> by numbered hotspot name (CHEVROLET####, GMC####), plus ${fmt(R.gm_generic)} sightings of the generic "myChevrolet"-style hotspots, which can't be told apart.</li>
  <li><b>${fmt(V.dashcams)} dashcams</b> and <b>${fmt(V.fleet_telematics)}</b> fleet-telematics units (Samsara, Cradlepoint, Netradyne and similar) on commercial vehicles and buses.</li>
  <li><b>${fmt(alto.devices)} Alto</b> rideshare cars, ${uber.devices} Uber Beacons and ${lyft.devices} Lyft Amps.</li></ul>
  <p>That's why "something is following me" is usually traffic. Across all drives, <b>${fmt(tr1.devices)}</b> devices kept intermittent pace with you for at least 10 minutes and 3 km and never appeared again, and ${fmt(tr2.devices)} more rode alongside for part of a trip. A further ${fmt(cab.devices)} were strong, steady signals inside the car for ten minutes or more: your phone under a fresh address, or a rider's.</p>`);

  // 9 ESP32
  s=S_('iot','9 \u00b7 ESP32 boards and what they were doing');
  const EF=n=>E.families.find(f=>f.product.indexOf(n)>=0)||{n:0,open:0,mobile:0,multiday:0};
  P(s,`<p><b>${fmt(E.total)} Espressif-based devices</b> that aren't yours were heard: ${fmt(E.registered_boards)} boards on addresses registered to Espressif (${fmt(E.ble)} over Bluetooth, ${fmt(E.wifi)} as Wi-Fi access points, ${E.both_radios} on both) and ${fmt(E.la_form)} more running the kind of Wi-Fi hotspot older ESP modules create. ${pct(E.fixed,E.radios)}% never moved and ${fmt(E.once)} were heard only once or twice: home devices caught in passing.</p>
  <ul><li><b>Most are appliances waiting for their owner's phone:</b> ${EF('Levoit').n} Levoit and Cosori units, ${EF('Govee').n} Govee devices, purifiers, fans, coffee machines.</li>
  <li><b>${E.behaviour.setup} were broadcasting an open hotspot,</b> which usually means setup was never finished: ${EF('Tineco').open} Tineco floor washers, ${EF('Smart Life').open} Tuya "Smart Life" plugs, ${EF('Windmill').open} Windmill air conditioners. ${E.behaviour.setup_multiday} were still like that on a second day.</li>
  <li><b>${pct(E.channels.esp_ch1,E.channels.esp_wifi)}% of ESP access points sit on channel 1,</b> the chip's default, against ${pct(E.channels.other_ch1,E.channels.other_wifi)}% of other networks.</li>
  <li><b>The movers are fleets and vehicles:</b> Lime scooters, Netradyne dashcams and IOSiX loggers on trucks, a handful of units that roam the city and cross your path days apart.</li>
  <li><b>${EF('Factory-default').n} boards still carry a factory name</b> like "ESP32" or "ESP_xxxxxx", and ${EF('AI-Thinker').n} run stock AI-Thinker firmware.</li></ul>
  <p>None travelled with you, none imitates a public network, and none carries an attack-tool name. Your T-Deck Plus and your other ESP32 nodes don't appear at all, because none of them advertise. The ESP32 tab has the identification table.</p>`);

  // 10 LoRa
  s=S_('lora','10 \u00b7 LoRa and Meshtastic');
  const ld=L.days.map(d=>longDate(d[0])+': '+d[1]+' packets / '+d[2]+' nodes').join('; ');
  P(s,`<p>The LoRa receiver did work. It logged <b>${L.packets} Meshtastic packets from ${L.nodes} distinct nodes</b>, all during the Portland week (${ld}). ${L.relay} of the ${L.packets} were relays of someone else's traffic, received near the radio's floor: median ${L.rssi[1]} dBm, best ${L.rssi[2]} dBm. No LoRa packets were logged in the Los Angeles sessions. Positions on these rows are where you heard the packet, not where the node sits.</p>`);

  // 11 footprint
  s=S_('footprint','11 \u00b7 Your own radio footprint');
  P(s,`<p>Every session in this dataset was recorded on the <b>T-Deck Plus</b>. The absence of your own ESP32 nodes is good news: nothing you built advertises. No access-point beacons and no Bluetooth advertisements came from the T-Deck or from your other nodes, so a passive scanner like yours can't see them. Two transmissions remain, both from scanning:</p>
  <ul><li><b>Wi-Fi scans are active.</b> The T-Deck Plus build calls <code>WiFi.scanNetworks(false, true)</code>, which defaults to an active scan. Every sweep sends probe requests carrying the board's own Espressif address. Your logs don't record probe requests, which is why this data can't show them, but anyone running a probe sniffer would see that same address wherever you drive.</li>
  <li><b>Bluetooth scans are active too</b> (<code>setActiveScan(true)</code>): the T-Deck sends scan requests to devices that advertise. In the current source only the Cardputer ADV build scans Bluetooth passively.</li></ul>
  <p><b>To go fully passive on the T-Deck Plus:</b> call <code>WiFi.scanNetworks(false, true, true, 120)</code> (passive, about 120 ms per channel) and switch its Bluetooth scan to <code>setActiveScan(false)</code>. Expect slower Wi-Fi sweeps and fewer Bluetooth device names, since some names only arrive in scan responses. If you'd rather keep active Wi-Fi scanning, randomizing the station address each session removes the stable fingerprint.</p>
  <p><b>What you carry does show.</b> The cabin count in section 4 is also a picture of you: about ${RD.baseline[0][0]} steady Bluetooth signals ride along on a typical shift, the car's and your own phone's among them. They rotate address on a timer, many of them exactly on the quarter hour, so nobody can follow one across days by address. Anyone standing next to the car can still count them.</p>`);

  // 12 threat recap
  s=S_('threats','12 \u00b7 Threat search, in brief');
  P(s,`<p><b>No persistent tail.</b> Only your Chevrolet and one fleet Tesla you drove twice travelled with you on more than one day. The longest any unidentified device stayed with you was ${TS.longest_unknown_min} minutes. <b>No attack hardware:</b> no Pineapple, Flipper or attack-firmware signature, and all ${fmt(TS.joke_ssids)} alarming network names (from "FBI Surveillance Van" to "Pineapple") sat on ordinary home routers. <b>Surveillance infrastructure is present:</b> ${TS.flock_devices} Flock license-plate-reader indicators at fixed sites and ${TS.axon_devices} Axon units from passing or parked officers; none appeared on a second day and none stayed in range while you moved. <b>${fmt(TS.recurring_devices)} devices did turn up on three or more days</b> away from your depot and home. Every one is a scooter, a bus, a fleet car, another driver working the same streets, or a product whose units all share one address. <b>The GPS faults</b> were coordinate errors: during the May 7 jump the scanner kept hearing ${A.evidence.map(e=>e.seen_in_window+' '+(e.type==='WIFI'?'Wi-Fi':'Bluetooth')).join(' and ')} devices from home.</p>`);
  const tl=el('p');const ta=el('a',null,'Open the full threat search \u2192');ta.href='#threats';ta.style.cssText='font-family:var(--disp);font-weight:600';tl.append(ta);s.append(tl);

  // 13 data notes
  s=S_('notes','13 \u00b7 Data notes');
  const Q=S.quality;
  P(s,`<p>${S.totals.source_files} CSV files, of which ${S.totals.empty_files} held only a header (a session that never got a GPS fix), leaving ${S.totals.files} sessions. Of ${fmt(Q.lines)} data lines, ${fmt(S.totals.rows)} were kept and ${fmt(Q.dropped_unreadable)} dropped as unreadable. ${fmt(Q.recovered_no_address)} of the kept rows are Bluetooth sightings whose address the firmware had overwritten with the device's name; they are kept by name. Wi-Fi and Bluetooth are separated by type. GPS was limited to California and Oregon and checked three ways (see Method). Bluetooth totals are a floor, because the firmware records at most 31 advertisements per scan and ${pct(Q.ble_scans_at_cap,Q.ble_scans)}% of scans hit that cap. Street and neighborhood names: \u00a9 OpenStreetMap contributors, via Nominatim. Device positions are strength-weighted estimates, accurate to about a block for strong fixed transmitters.</p>`);

  sec.append(footer());stage.append(sec);
}

  sec.append(el('div','note','<b>Reading this table.</b> The traffic rows are addresses that appeared for one stretch of one drive and never again: vehicles beside you going the same way. The cabin row is strong, steady signals inside the car for ten minutes or more. A phone changes its address every few minutes, so one phone produces many of these in a day; yours accounts for most of them, riders for the rest.'));

  sec.append(el('div','note','<b>Nothing unidentified lasted longer than '+TS.longest_unknown_min+' minutes.</b> The car\'s own electronics top the list because they are in the car. The other Teslas are fleet cars parked at your depot: nearly every minute they were heard was there, and one passing sighting elsewhere stretched the distance. A shared product name is several different units added together. The unidentified rows are ride-length and each appears on a single day: a rider\'s phone, watch or camera. No police or plate-reader equipment is anywhere on this list.'));

  sec.append(el('h3','sh','Test 3 \u00b7 What keeps turning up in different places?'));
  sec.append(el('p','lead','A tail doesn\'t have to ride along; it could simply keep appearing. So: every mobile device met on three or more days somewhere other than your depot, home or lodging.'));
  sec.append(table(['What they are','Devices','Most days','Longest single encounter'],TT.recurring.map(x=>[x.klass,fmt(x.devices),x.max_days,x.longest_min+' min']),[1,2,3],[0]));
  sec.append(el('div','note','<b>'+fmt(TS.recurring_devices)+' devices, all accounted for.</b> You drive the same territory on the same schedule, so do buses, scooters, delivery vans and other drivers, and many of the Teslas are from your own depot. None of the '+fmt(TS.recurring_devices)+' passed test 1 on even two days, and the longest any of them stayed in range at one time was '+Math.max(...TT.recurring.map(x=>x.longest_min))+' minutes.'));

  const lime=F('Lime'),wind=F('Windmill'),ray=F('Raymote'),tin=F('Tineco'),tuya=F('Smart Life'),ait=F('AI-Thinker'),drv=F('Driveri'),eld=F('IOSiX'),maz=F('Mazzer'),lev=F('Levoit'),gov=F('Govee'),def=F('Factory-default'),prov=F('provisioned'),anon=F('Unnamed Bluetooth'),ls=F('"LS"'),rad=F('MSRADAR'),pwr=F('power stations'),vac=F('Robot vacuums'),led=F('LED controllers'),rhx=F('RHX8'),pnr=F('PNR08I'),strut=F('STRUT');
  const c2=el('div','prose');c2.innerHTML=`<p><b>Waiting for a phone (${fmt(B.ble_named+B.ble_anon)}).</b> The resting state of a smart appliance: it advertises over Bluetooth a few times a second so its owner's app can find it. You hear it for the seconds you're in range.</p>

  <p><b>Stuck in setup.</b> ${fmt(B.setup)} devices were holding an open hotspot. The big groups: <b>${tin.open} Tineco floor washers</b>, <b>${tuya.open} Tuya "Smart Life" plugs and switches</b>, ${ait.open} AI-Thinker modules, ${wind.open} of ${wind.n} Windmill air conditioners, ${vac.open} robot vacuums and ${ray.open} of ${ray.n} Raypak "Raymote" water heaters. Tineco and Tuya devices open that hotspot whenever they aren't paired, so most of these are appliances whose owners never bothered with the app. ${B.setup_multiday} were heard in the same state on a second day, so they aren't mid-install. The risk is to the owner: a stranger in range can claim the device.</p>

  <p><b>Roaming the city.</b> A few units are worth describing because they recur. ${ls.mobile} boards named just "LS" were each heard in several places days apart, one on ${(E.mover_multiday.find(m=>m[1]==='LS')||[0,0,0])[2]} different days up to ${(E.mover_multiday.find(m=>m[1]==='LS')||[0,0,0,0])[3]} km apart, never for more than three minutes. Vehicle radar units named "MSRADAR\u2026" come in pairs; one pair was heard twice, ten days and 22 km apart, for a few seconds each time. That is the signature of a bus or truck whose route crosses yours. A follower would stay in range.</p>
  <p><b>Marking businesses.</b> ${maz.n} Mazzer commercial coffee grinders, each hosting a small network for setup and service, mark cafes in ${(maz.areas||[]).slice(0,2).join(' and ')}. A Zumex juicer, Raypak pool heaters and Blaze Audio amplifiers are the same kind of signal: commercial equipment announcing itself.</p>
  <p><b>The unnamed ${fmt(anon.n)}.</b> These advertise from an Espressif address with no name. ${fmt(anon.fixed)} never moved and ${anon.multiday} were heard on more than one day, so they're installed devices. Many products put their identity in the advertisement's data fields, which the T-Deck doesn't log. Logging that payload would identify most of them.</p>`);
  sec.append(el('div','note','<b>Nothing here was following you.</b> No ESP board travelled with you on any drive. '+(E.checks.lure_named_open===0?'No open ESP hotspot imitates':fmt(E.checks.lure_named_open)+' open ESP hotspots imitate')+' a public or brand network, and '+(E.checks.attack_tool_names===0?'no board carries':fmt(E.checks.attack_tool_names)+' boards carry')+' the default name of an attack tool. ESP-based attack gear would look different: a lure copying a public network name, or a board keeping pace with the car.'));

  sec.append(el('h3','sh','Identified by product'));
  sec.append(el('p','lead','Names matched to products. "Open" counts open hotspots; "moved" means heard more than 500 m apart; areas are where most were heard. "Likely" marks a less certain match.'));
  const fam=E.families.filter(f=>f.identified);
  sec.append(table(['Product','Kind','Devices','Wi-Fi / BLE','Open','Moved','2+ days','Mostly heard in'],fam.map(f=>[f.product+(f.confidence==='likely'?' <span class="tag">likely</span>':''),f.sector,f.n,f.wifi+' / '+f.ble,f.open||'',f.mobile||'',f.multiday||'',(f.areas||[]).slice(0,2).join('; ')]),[2,4,5,6],[0]));

  sec.append(el('div','note','<b>Reading the two cards.</b> "Kept by name" rows are Bluetooth sightings whose address the firmware overwrote with the device\'s name; "cut short" means only the first 17 characters of the name survived. "Contradicted by radios" and "frozen fix" are the two new GPS checks described below. Every row is kept in the counts; only rows with a usable fix are placed on the map.'));
  sec.append(el('div','note','<b>Files.</b> '+T.source_files+' CSV files, '+T.empty_files+' of them header-only: the firmware creates a file at every boot and writes rows only once it has a GPS fix. That leaves '+T.files+' sessions. <b>Dropped:</b> '+Q.dropped.map(d=>fmt(d[1])+' '+({'bluetooth row with corrupted address and no usable name':'Bluetooth rows with a corrupted address and no usable name','continuation or garbage line':'stray continuation or garbage lines'}[d[0]]||d[0])).join('; ')+'. <b>Times</b> are GPS time (UTC) converted to Pacific; '+fmt(Q.est_time)+' rows with an impossible date took the time of the row before.'));

  sec.append(el('h3','sh','The firmware fault behind the recovered rows'));
  P(sec,`<p>Builds that ran from March 28 to May 15 lost Bluetooth addresses in a specific way: when a device's name was 16 characters or longer, the name landed in the address column. Shorter names were unaffected. That pattern fits a pointer to a temporary string being reused after the string was freed: a 17-character address and a long name both need heap storage, and the name took over the address's slot. The first build also did the reverse on ${fmt(Q.name_lost)} rows, writing the address where the name belongs. Builds from May 16 on are clean.</p>
  <p>The recovered rows have no address, so they are tracked by name. For a Tesla or a Lime vehicle the name is unique to one unit, and those join cleanly with later sightings of the same unit. For everything else the name is a product name shared by many units, so those rows count toward totals but not toward device-by-device analysis.</p>`);

  sec.append(el('h3','sh','GPS: three checks'));
  const f=el('div','finding notable');

  sec.append(table(['Radio','Devices heard during the jump','Of those, known from other days','Where those normally are'],A.evidence.map(e=>[e.type==='WIFI'?'Wi-Fi':'Bluetooth',e.seen_in_window,e.known_elsewhere,'at your home base']),[1,2]));

  f2.append(el('h4',null,'2 \u00b7 Fixes that disagree with fixed transmitters <span class="pill notable">new</span>'));
  f2.append(el('p',null,'Every Wi-Fi access point, and every Bluetooth device that stays put, was given a position: the middle of everywhere it was heard. Then each logged minute was compared with the transmitters in range. Where five or more were heard, the fix agreed with them to a median of '+RC.median_m+' m ('+fmt(RC.minutes_checkable)+' minutes checked, 99% within '+RC.p99_m+' m). '+RC.flagged_minutes+' minutes disagreed by more than 500 m and had their positions set aside.'));
  sec.append(f2);
  sec.append(table(['Date','Time','Minutes','How far off','Transmitters heard','What happened'],A.radio_events.map(e=>[mono(e.date),e.start+(e.end===e.start?'':e.minutes<=2?' and '+e.end:'\u2013'+e.end),e.minutes,e.max_m>=1000?(e.max_m/1000).toFixed(1)+' km':e.max_m+' m',e.anchors,
    e.minutes>=20?'Stationary indoors for over two hours; the fix wandered while the same transmitters stayed in range.':e.max_m>=10000?'One bogus fix at the start of a session, 51 km from where the transmitters are.':'A brief lag, most likely under cover.']),[2,3,4],[5]));

  f3.append(el('p',null,'The firmware keeps writing its last position when it loses lock. '+Q.stale_events+' times a position froze for 20 seconds or more and then leapt: tunnels and parking structures, the LAX Sepulveda tunnel most of all. Those rows keep their observations and lose their position.'));
  sec.append(f3);

  sec.append(el('h3','sh','Caveats'));
  sec.append(el('ul','clean',
    '<li><b>2.4 GHz only.</b> The T-Deck hears Wi-Fi channels 1\u201314. Networks that exist only on 5 GHz or 6 GHz are absent.</li>'+
    '<li><b>Bluetooth 31-per-scan cap.</b> The firmware records at most 31 advertisements per scan. '+pct(Q.ble_scans_at_cap,Q.ble_scans)+'% of '+fmt(Q.ble_scans)+' scans hit it, so in a crowd it under-counts. Bluetooth totals are a floor.</li>'+
    '<li><b>Random addresses.</b> Most phones and many wearables change Bluetooth address every few minutes, so one device appears as many. Following such a device across days by address is impossible by design.</li>'+
    '<li><b>Vendor names.</b> A maker is assigned only when the address falls in a registered block. A random Bluetooth address can land in a registered block by chance; across this dataset that is on the order of a thousand addresses, about ten of them in Espressif blocks.</li>'+
    '<li><b>Security labels</b> changed between firmware builds; the Report\'s Wi-Fi section says which figures rest on which sessions.</li>'+
    '<li><b>Classic Bluetooth is invisible.</b> A BLE-only scanner never sees classic-Bluetooth modules, so their absence here isn\'t proof of absence on the street.</li>'+
    '<li><b>Centroids, not pins.</b> Each device is placed at the signal-strength-weighted center of where it was heard. A strong fixed access point is accurate to a block; a brief drive-by less so.</li>'+
    '<li><b>Minutes.</b> Dwell and rate figures count distinct minutes with at least one logged scan.</li>'+
    '<li><b>Names.</b> Street and neighborhood names: \u00a9 OpenStreetMap contributors, via Nominatim. Personal names in network names are redacted for display. Police and plate-reader equipment is counted but never listed or mapped.</li>'));
  sec.append(footer());stage.append(sec);
}

    color:{label:'Streets, full color (OpenStreetMap)',url:'https://tile.openstreetmap.org/{z}/{x}/{y}.png',attr:'\u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors',max:19,filter:d=>d?'brightness(.72) contrast(1.05)':'none'},
    voyager:{label:'Streets, clean (CARTO Voyager)',url:'https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png',attr:'\u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors \u00a9 <a href="https://carto.com/attributions">CARTO</a>',max:19,sub:'abcd',filter:d=>d?'brightness(.75)':'none'},
    lightdark:{label:'Light / dark (CARTO)',url:null,attr:'\u00a9 <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors \u00a9 <a href="https://carto.com/attributions">CARTO</a>',max:19,sub:'abcd',filter:()=>'none'},
    none:{label:'No streets (county outlines)',url:null}};

    if(tileLayer){map.removeLayer(tileLayer);tileLayer=null;}

  // landmark labels (only without street tiles; the tiles carry their own)
  const LMS=[['Downtown LA',34.05,-118.24],['LAX',33.942,-118.40],['Santa Monica',34.02,-118.49],['Covina (home base)',34.0775,-117.8587],['East LA depot',34.07,-118.199],['Pasadena',34.15,-118.14],['Long Beach',33.77,-118.19],['Portland',45.52,-122.68]];
  const lblLayer=L.layerGroup();LMS.forEach(([n,a,o])=>L.marker([a,o],{interactive:false,icon:L.divIcon({className:'lbl',html:n,iconSize:[0,0]})}).addTo(lblLayer));

  function cm(lat,lon,color,r,pop){return L.circleMarker([lat,lon],{radius:r,color:'#fff',weight:1,fillColor:color,fillOpacity:.95}).bindPopup(pop);}
  const stops=L.layerGroup(),espC=L.layerGroup(),anom=L.layerGroup(),regions=L.layerGroup(),roads=L.layerGroup();
  function buildMarkers(){[stops,espC,anom,regions,roads].forEach(g=>g.clearLayers());
    ST.slice(0,60).forEach(s=>cm(s.lat,s.lon,cssv('--accent'),Math.min(10,3+s.days/2),`<b>Stop</b> \u00b7 ${s.days} day(s), ${s.visits} visit(s)<br>${s.mins} min total${s.anchor?'<br>'+s.anchor:''}`).addTo(stops));
    esp.clusters.slice(0,40).forEach(c=>cm(c.lat,c.lon,cssv('--wifi-hidden'),Math.min(9,3+c.macs),`<b>ESP32 cluster</b> \u00b7 ${c.macs} radios<br>${(c.names||[]).slice(0,4).join(', ')}`).addTo(espC));
    L.polyline(AN.path.map(p=>[p[0],p[1]]),{color:cssv('--corr'),weight:2,dashArray:'5,5'}).bindPopup(`<b>GPS fault</b> ${AN.date} ${AN.start}\u2013${AN.end}<br>Claimed: ${AN.claimed.place}<br>Actually at home; the radios didn't move.`).addTo(anom);

    R.regions.ble.slice(0,10).forEach(g=>cm(g.lat,g.lon,cssv('--ble'),7,`<b>${g.name}</b><br>Bluetooth-busy region (people)<br>${fmt(g.ble)} Bluetooth addresses in ${g.minutes} min \u00b7 ${g.ble_per_min}/min`).addTo(regions));
    R.reps.filter(r=>r.road).forEach(r=>cm(r.lat,r.lon,cssv('--rep4'),4,`<b>${r.road}</b>${r.hood?'<br>'+r.hood:''}<br>Driven on ${r.days} separate days`).addTo(roads));}

  const markerLayers={stops,esp:espC,anom,regions,roads};
  function syncMarkers(){for(const k in markerLayers){if(L_[k])markerLayers[k].addTo(map);else map.removeLayer(markerLayers[k]);}

  const defs=[['tracks','Driven routes','line','--track'],['repeat','Repeat roads (by days)','dot','--rep3'],['corridor','I-10 commute corridor','line','--corr'],
    ['roads','Frequented roads (named)','dot','--rep4'],['regions','High-RF regions','dot','--wifi-sec'],['density','Signal density','sw','--heat3'],
    ['wifi','Wi-Fi networks','dot','--wifi-sec'],['ble','Bluetooth LE','dot','--ble'],['stops','Stops','dot','--accent'],['espall','ESP32 boards (all)','dot','--wifi-hidden'],['esp','ESP32 clusters','dot','--wifi-hidden'],['anom','GPS faults','line','--corr']];
  const lyrs=$('#lyrs');
  if(LOCAL){const bm=el('label','bmsel');bm.append(el('span',null,'Base map'));const sel=el('select');sel.id='basemap';
    Object.entries(BASES).forEach(([k,B])=>{const o=el('option',null,B.label);o.value=k;if(k===basemap)o.selected=true;sel.append(o);});

  const swatches=[];
  defs.forEach(([k,label,shape,tok])=>{const row=el('label','lyr');const cb=el('input');cb.type='checkbox';cb.checked=L_[k];cb.id='lyr-'+k;

  syncMarkers();

  function legend(){const box=$('#legend');box.innerHTML='';

    /* only what the layer list can't say by itself: layers drawn in more than one color */
    box.append(el('div',null,'<b style="font-family:var(--disp);font-size:11px">Legend</b>'));
    if(L_.wifi){add(cssv('--wifi-sec'),'Wi-Fi secured');add(cssv('--wifi-open'),'Wi-Fi open');add(cssv('--wifi-hidden'),'Wi-Fi hidden');add(cssv('--wifi-unk'),'Wi-Fi, security not recorded');}
    if(L_.repeat){add(cssv('--rep1'),'road driven 3 days');add(cssv('--rep2'),'4\u20136 days');add(cssv('--rep3'),'7\u201311 days');add(cssv('--rep4'),'12+ days');}
    if(L_.regions){add(cssv('--wifi-sec'),'Wi-Fi-dense region');add(cssv('--ble'),'Bluetooth-busy region');}
    if(L_.density){add(cssv('--heat1'),'fewer signals','sw');add(cssv('--heat4'),'more signals','sw');}

  function size(){const s=map.getSize();cv.width=s.x*dpr;cv.height=s.y*dpr;cv.style.width=s.x+'px';cv.style.height=s.y+'px';
    L.DomUtil.setPosition(cv,map.containerPointToLayerPoint([0,0]));ctx.setTransform(dpr,0,0,dpr,0,0);}
  function draw(){

    const south=b.getSouth(),north=b.getNorth(),west=b.getWest(),east=b.getEast();

    const r=z>=15?2.2:z>=13?1.6:z>=11?1.1:.8;

    if(L_.espall){const fx=cssv('--wifi-hidden'),mv=cssv('--crit'),rr=z>=13?3:2.2;esp.points.forEach(p=>{if(p[0]<south||p[0]>north||p[1]<west||p[1]>east)return;const q=toPt(p[0],p[1]);ctx.fillStyle=p[2]?mv:fx;ctx.beginPath();ctx.arc(q.x,q.y,rr,0,6.283);ctx.fill();});}
  }
  window.MAP.restyle=()=>{if(LOCAL)setBase(basemap);else{outlines();draw();}buildMarkers();syncMarkers();swatches.forEach(([sw,tok])=>sw.style.background=cssv(tok));legend();};
  map.on('move zoom',()=>{L.DomUtil.setPosition(cv,map.containerPointToLayerPoint([0,0]));draw();});
  map.on('zoomstart',()=>{cv.style.opacity=.25;});map.on('zoomend',()=>{cv.style.opacity=1;size();draw();});
  map.on('resize',()=>{size();draw();});
  size();setBase(basemap);

  map.on('click',async(e)=>{
    const pt=e.containerPoint;let best=null,bd=10;
    const scan=(P,kind,prefix)=>{for(let i=0;i<P.length;i+=2){const p=map.latLngToContainerPoint([P[i]/1e5,P[i+1]/1e5]);
      const d=Math.abs(p.x-pt.x)+Math.abs(p.y-pt.y);if(d<bd){bd=d;best={kind,idx:(i/2)|0,prefix};}}};
    if(L_.wifi)scan(WP,'Wi-Fi','wifi');if(L_.ble)scan(BP,'Bluetooth','ble');
    if(!best){$('#detail').classList.remove('on');return;}
    const chunk=await J(best.prefix+'_d'+String(Math.floor(best.idx/CH)).padStart(3,'0')+'.json');
    const row=chunk[best.idx%CH];if(!row)return;
    const [nm,mac,vendor,first,last,days,rssi,sight,kindcol,spread]=row;
    $('#detbody').innerHTML=`<h5>${nm?nm:'(unnamed '+best.kind+' device)'}</h5><dl>
      <dt>Type</dt><dd>${best.kind}</dd><dt>Address</dt><dd>${mac}</dd><dt>Maker</dt><dd>${vendor||'\u2014'}</dd>
      <dt>${best.kind==='Wi-Fi'?'Security':'Address type'}</dt><dd>${kindcol||'\u2014'}</dd><dt>Peak signal</dt><dd>${rssi} dBm</dd>
      <dt>Sightings</dt><dd>${fmt(sight)}</dd><dt>Days seen</dt><dd>${days}</dd><dt>Spread</dt><dd>${spread} m</dd>
      <dt>First \u2192 last</dt><dd>${first} \u2192 ${last}</dd></dl>`;
    $('#detail').classList.add('on');});
  $('#detx').onclick=()=>$('#detail').classList.remove('on');
  $('#toLA').onclick=()=>map.setView([34.03,-118.30],11);
  $('#toPDX').onclick=()=>map.setView([45.52,-122.76],11);
}

route();
</script>

</html>

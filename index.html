.leaflet-popup {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;
	border-radius: 3px;
	color: #222;
	white-space: nowrap;
	-webkit-user-select: none;
	-moz-user-select: none;
	-ms-user-select: none;

.leaflet-tooltip.leaflet-interactive {
	cursor: pointer;

.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

	}
.leaflet-tooltip-top:before {

	margin-left: -6px;

}
.leaflet-tooltip-right {

}
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {

/* Shell: one header bar over every section; a quiet instrument-panel palette shared by the landing pages. */
:root{--sh-bg:#f4f4f0;--sh-panel:#ffffff;--sh-ink:#1c1f24;--sh-ink2:#545a66;--sh-ink3:#8a8f9b;--sh-line:#dddcd3;--sh-acc:#b8660f;--sh-acc2:#2f74c0;--sh-oth:#7a5bd0;
  --sh-sans:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;--sh-disp:"Space Grotesk","Inter",system-ui,sans-serif;--sh-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--sh-bg:#0d1016;--sh-panel:#151a25;--sh-ink:#eef1f7;--sh-ink2:#a8aec0;--sh-ink3:#747b91;--sh-line:#272d3d;--sh-acc:#f0a850;--sh-acc2:#5aa0ec;--sh-oth:#a98bf0;color-scheme:dark}}
:root[data-theme="dark"]{--sh-bg:#0d1016;--sh-panel:#151a25;--sh-ink:#eef1f7;--sh-ink2:#a8aec0;--sh-ink3:#747b91;--sh-line:#272d3d;--sh-acc:#f0a850;--sh-acc2:#5aa0ec;--sh-oth:#a98bf0;color-scheme:dark}
html,body{background:var(--sh-bg)}
#shellbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:1500;background:var(--sh-panel);border-bottom:1px solid var(--sh-line);font-family:var(--sh-sans);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:1600;background:var(--sh-panel)}
.sh-in{max-width:1280px;margin:0 auto;display:flex;align-items:center;gap:6px 16px;flex-wrap:wrap;padding-block:9px}
.sh-brand{display:flex;align-items:center;gap:9px;margin-right:auto;text-decoration:none;color:var(--sh-ink)}
.sh-brand i{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 62% 38%,var(--sh-acc) 0 32%,transparent 33%),radial-gradient(circle at 62% 38%,transparent 0 45%,var(--sh-ink3) 46% 50%,transparent 51%);box-shadow:inset 0 0 0 1px var(--sh-line)}
.sh-brand b{font-family:var(--sh-disp);font-size:15px;letter-spacing:-.01em;line-height:1.1;display:block}
.sh-brand span{font-family:var(--sh-mono);font-size:10px;letter-spacing:.12em;color:var(--sh-ink3)}
.sh-links{display:flex;gap:2px;flex-wrap:wrap}
.sh-links a{font-size:13px;font-weight:500;color:var(--sh-ink2);text-decoration:none;padding:6px 11px;border-radius:7px}
.sh-links a:hover{background:var(--sh-bg);color:var(--sh-ink)}
.sh-links a[aria-current="true"]{background:var(--sh-ink);color:var(--sh-panel)}
.sh-links a:focus-visible,.sh-theme:focus-visible,.shp a:focus-visible{outline:2px solid var(--sh-acc);outline-offset:2px}
.sh-theme{font-family:var(--sh-mono);font-size:11px;color:var(--sh-ink2);background:var(--sh-bg);border:1px solid var(--sh-line);padding:6px 9px;border-radius:7px;cursor:pointer}
#subbar{border-top:1px solid var(--sh-line)}
#subbar .sh-in{padding-block:5px}
#subbar nav{display:flex;gap:2px;flex-wrap:wrap}
/* landing pages */
.shp{max-width:1080px;margin:0 auto;font-family:var(--sh-sans);color:var(--sh-ink);line-height:1.55;font-size:15px;
  padding-block:34px 70px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.shp h1,.shp h2,.shp h3{font-family:var(--sh-disp);letter-spacing:-.015em;text-wrap:balance;margin:0}
.shp h1{font-size:clamp(28px,4.6vw,44px);line-height:1.08;margin:6px 0 12px;font-weight:600}
.shp h2{font-size:22px;margin:40px 0 12px;font-weight:600}
.shp h3{font-size:16px;margin:0 0 6px;font-weight:600}
.shp p{max-width:66ch;margin:0 0 12px}
.shp .ey{font-family:var(--sh-mono);font-size:11px;letter-spacing:.13em;text-transform:uppercase;color:var(--sh-acc)}
.shp .lead{font-size:17px;color:var(--sh-ink2)}
.shp a{color:var(--sh-acc2)}

<div data-pg="overview">
  <div class="ovb"><h2>The rig</h2>
  <p class="lead">Three radios on a hub, nine and a half hours, one commute. The rig worked, and it also told on itself: two boards kept restarting at the same point in their scan cycle, one bad GPS line in every 470 drew a line to France, and at least 2,380 of the Wi-Fi networks in the summary were never networks.</p>
  <div class="kpis" id="kpis"></div>
  <p class="cap">The capture folder is everything the bridge recorded. The Wi-Fi count is the conservative one, networks that a scan on at least one board confirmed. The bridge's own summary says 13,042; the <a href="#r1-faults">Faults</a> section explains the gap.</p></div>
  <div class="ovb"><h2>What was seen</h2>
  <p class="lead">What announced itself along the way: cars, dashcams, fleet gear, roadside equipment, and the rig's own two LoRa nodes. No bus or train identified itself.</p>
  <div class="kpis" id="kpis2"></div></div>
  <div class="ovb"><h2>Sections</h2><div class="toc" id="toc-1"></div></div>
</div>
  <section id="trip" data-pg="route">
  <h2>The day, as the GPS saw it</h2>
  <p>The car set off at 10:31, took US 26 east and was parked at a work site by 10:52. The rig sat there until 15:17. The way back was slower and denser: surface streets, a 15-minute stop at Guitar Center from 15:40, then Tualatin Valley Highway until 16:35. It kept logging while parked until 19:50. Both ends of the day are inside a private area: the track stops at its edge, and nothing heard from inside it is listed or mapped.</p>
  <div class="panel">
    <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin-bottom:8px">
      <h3 style="margin:0;flex:1 1 220px">Track, 57 km</h3>
      <button class="btn" id="tgl" aria-pressed="false">Show the garbled fixes</button>
    </div>
    <div id="map"></div>
    <p class="cap" id="mapcap"></p>
  </div>
  <div class="panel">
    <h3>Seven phases</h3>
    <div class="scroll"><table id="phases"></table></div>
    <p class="cap">Two shorter pauses on the last leg, 3 minutes at 16:10 and 5.5 minutes at 16:20, look like lights or traffic. GPS held 16 to 22 satellites all day with a median estimated accuracy of 3 to 5 m, including inside the parked car.</p>
  </div>
</section>

    <h2>Seen and heard are different things</h2>
    <p>Most of this capture is things being <b>seen</b>: a device broadcast a short announcement that it exists, and the rig wrote down the announcement. Very little of it is anything being <b>heard</b>, in the sense of what was said. The line falls differently on each radio.</p>
    <div class="panel"><div class="scroll"><table id="shT"></table></div>
    <p class="cap">The boards reported <span style="font-family:var(--mono)">payloads: false</span> for Wi-Fi all day. LoRa is the exception, because a LoRa packet is short enough that the whole thing is logged.</p></div>
    <p>So every count on this page is of things that chose to announce themselves. A car with its hotspot switched off, a bus with no public Wi-Fi and a phone with Bluetooth off were all there and are all missing.</p>

<div id="v-run2" hidden>
<div data-pg="overview">
  <div class="ovb"><h2>The rig</h2>
  <p class="lead">Sunday's run was a moving one: five and a half hours, 149 km, from the west side over the West Hills, through downtown, out to the airport, back across North Portland and back on TV Highway. The T-Embed and the C5 never restarted. The Cardputer restarted 39 times, and where it did so says why.</p>
  <div class="kpis" id="r2_kpis"></div>
  <p class="cap">The capture is the bridge's own folder again, 279,556 events. This zip has no bridge log, so rejected lines cannot be counted this time.</p></div>
  <div class="ovb"><h2>What was seen</h2>
  <p class="lead">A day in traffic across the whole city: a dozen strangers on the LoRa mesh, six airport shuttle buses that name themselves, the phones of a bus that rode up Chávez beside the car, and a network called TowerWAVPDX at Sylvan. TriMet itself never said a word.</p>
  <div class="kpis" id="s2_kpis"></div></div>
  <div class="ovb"><h2>Sections</h2><div class="toc" id="toc-2"></div></div>
</div>

  <section data-pg="route">
    <h2>The day, as the GPS saw it</h2>
    <p>The car set off at 11:22 and stopped for five minutes at Jacksons in Tanasbourne. Barnes Road led over the hills and past Providence Park at 12:06. After downtown and a climb up Marquam Hill the car crossed the Hawthorne Bridge at 12:50, ran Hawthorne out to César E. Chávez Boulevard, and turned north to Sandy. Sandy and 82nd led to the airport, twice round the terminal loop, and a 25-minute stop at Cascade Station from 13:46. Nine phones there asked for the Best Buy guest network while the car was parked, which pins the stop to the right car park.</p>
    <p>The way back went west on Lombard to St. Johns, over the bridge, down Highway 30 into Northwest, back through downtown and the Lloyd District, once round the I-405 and I-5 loop, then up to Sylvan for five minutes and back on Canyon Road and TV Highway by 16:40. Both ends of the run are inside a private area: the track stops at its edge, and nothing heard from inside it is listed or mapped.</p>
    <div class="note">One correction to the operator's own note. The 12:59 message says "HAWTHONE AND MLK", but the GPS puts the car at Hawthorne and César E. Chávez at that moment. It had crossed MLK nine minutes earlier, at 12:50. So the run "from Hawthorne to Sandy" was up Chávez, and that is where the <a href="#r2-transit">Transit</a> section finds the bus.</div>

  <p><b>Stops.</b> Away from the depot there were ${stopTot} stops of four minutes or more across all days: ${dur['4–10 min']} short (4–10 min: pickups, drop-offs, quick waits), ${dur['10–30 min']} of 10–30 min, ${dur['30–60 min']} of 30–60 min and ${dur['over 1 h']} over an hour. Of the 20 longest, ${R.stops.longest_kinds.map(k=>k[1]+' sit at '+({food:'a restaurant or fast-food place','parking lot':'a parking lot','street or building':'the curb on an ordinary street',store:'a store','charging or fuel':'a charger or gas station',other:'somewhere OpenStreetMap doesn\'t classify'}[k[0]]||k[0])).join(', ')}.</p>
  <p><b>Other drivers on the air.</b> Alto's company cars broadcast a hex-encoded "RIDEALTO" network name. ${fmt(alto.devices)} of them were heard, ${alto.multiday} on more than one day, mostly around ${alto.areas.slice(0,3).map(a=>a[0]).join(', ')}. ${uber.devices} Uber Beacon driver lights (${uber.areas.length?'mostly '+uber.areas[0][0]:''}) and ${lyft.devices} Lyft Amp displays also showed up. The <a href="#transit">Transit tab</a> follows all of them: where each Alto car was met, and what the ones met twice have in common.</p>
  <p><b>What would settle it.</b> Joining the inferred rides with real trip records would show which plateaus are trips, how many trips left no Bluetooth trace, and whether the ${RD.occupied_pct}% holds. Engaged and empty kilometers could then be split by area and hour.</p>`);
  s.append(table(['Repeated stops, by neighborhood (away from the depot)','Days','Visits','Total dwell'],R.stops.clusters.filter(c=>c.days>=2||c.mins>=45).slice(0,10).map(c=>[c.place,c.days,c.visits,c.mins+' min']),[1,2,3]));

  // 5 commute
  s=S_('commute','5 · The I-10 run, East LA ↔ San Gabriel Valley');
  const best=C.best,worst=C.worst;
  P(s,`<p>One freeway run sits apart from the working routes: <b>${C.traversals} passes</b> along the ${C.length_km} km of the San Bernardino Freeway between the depot and the San Gabriel Valley (${C.east} eastbound, ${C.west} westbound), ${fmt(C.i10_total_km)} km in all. ${C.full} of them covered most of the corridor. Weekend runs averaged <b>${C.weekend_avg} km/h</b> and weekday runs <b>${C.weekday_avg} km/h</b>. The quickest was ${longDate(best.date)} (${best.dow}), ${best.km} km at ${best.avg_kmh} km/h; the slowest was ${longDate(worst.date)} (${worst.dow}), ${worst.mins} minutes for ${worst.km} km, ${worst.avg_kmh} km/h.</p>
  <p>Eastbound, the slowest kilometer is <b>km ${eS[0].km}</b> from the East LA end, near ${eS[0].near} (median ${eS[0].kmh} km/h), with km ${eS[1].km} near ${eS[1].near} next (${eS[1].kmh} km/h) and km ${eS[2].km} near ${eS[2].near} third (${eS[2].kmh} km/h). Westbound there are only ${C.west} runs, so read it lightly: the slowest point was km ${wS[0].km} near ${wS[0].near}, at ${wS[0].kmh} km/h.</p>`);
  const prof=C.slow.east.profile;
  s.append(chart('Eastbound speed along the corridor','Median km/h per kilometer from the East LA end, '+C.east+' runs',
    svgBars(prof.map(p=>({k:p[0],v:p[1]})),{unit:' km/h',label:k=>k%5===0?'km '+k:'',colorFn:r=>r.v<55?cssv('--crit'):r.v<70?cssv('--warn'):cssv('--good')}),
    'Red is under 55 km/h, amber under 70 km/h, green faster. Kilometers with fewer than three runs are left out.'));

  // 6 high-RF
  s=S_('rf','6 · High-RF regions');
  const lp=R.la_vs_pdx,stay=reg.wifi.slice(0,10).filter(g=>g.minutes>=60&&g.wifi_per_min<8),blankOpen=reg.wifi.slice(0,10).some(g=>g.open_pct==null);
  P(s,`<p>Two measures, two different things. <b>Unique Wi-Fi networks</b> track buildings: apartments, offices, storefronts. <b>Bluetooth flux</b>, new Bluetooth addresses per minute spent there, tracks people: shoppers, students, crowds. Minutes are distinct minutes with at least one logged scan inside the region.</p>
  <p>Downtown LA dominates by volume: <b>${fmt(dt.wifi)} Wi-Fi networks</b> and ${fmt(dt.ble)} Bluetooth addresses across ${fmt(dt.minutes)} minutes of driving through its core. Minute for minute the densest Wi-Fi was <b>Koreatown</b>, with ${fmt(kt.wifi)} networks in ${kt.minutes} minutes (${kt.wifi_per_min} new networks a minute), which fits LA's densest apartment district. The beach towns follow: the Venice canals and Ocean Park are packed with small residential networks, while downtown Santa Monica mixes in offices and campuses.</p>`);
  s.append(table(['Wi-Fi-dense region','Wi-Fi','Bluetooth','Minutes there','Wi-Fi / min','Open','Hidden'],reg.wifi.slice(0,10).map(g=>[g.name,fmt(g.wifi),fmt(g.ble),g.minutes,g.wifi_per_min,g.open_pct==null?'':g.open_pct+'%',g.hidden_pct+'%']),[1,2,3,4,5,6]));
  const bl=el('div');bl.style.marginTop='12px';
  bl.append(table(['Bluetooth-busy region (people)','Bluetooth','Minutes there','per minute'],reg.ble.slice(0,10).map(g=>[g.name,fmt(g.ble),g.minutes,g.ble_per_min]),[1,2,3]));
  s.append(bl);
  P(s,`<p>The Bluetooth leaders are campus and retail districts: Westwood by UCLA, downtown Santa Monica, the Beverly Hills business triangle, Glendale's city center, the east end of Koreatown, Venice, and the Beverly Grove blocks around the Beverly Center. Westchester ranks because of the airport approach. ${stay.length?(stay.length>1?stay.length+' Wi-Fi regions rank':'One Wi-Fi region ranks')+' only because a long time was spent there: '+stay.map(g=>g.name.replace(/ · near.*/,'')+' ('+g.minutes+' minutes)').join(' and ')+'.':''}${blankOpen?' The "open" column is blank where most of the region was only driven while the firmware wasn\'t recording security.':''} Regions are drawn separately for each measure, so the same name can cover a slightly different set of blocks in the two tables.</p>`);

  // 7 Wi-Fi landscape
  s=S_('wifi','7 · The Wi-Fi landscape');
  const eero=(SEC.open_hidden_vendors.find(v=>/eero/i.test(v[0]))||[0,0])[1],c14=R.ch14,juan=c14.vendors.filter(v=>/Juan|AltoBeam/i.test(v[0])).reduce((a,v)=>a+v[1],0);
  P(s,`<p><b>What the recorders can hear.</b> Both radios are 2.4 GHz only. Every network here is on channels 1–14; 5 GHz and 6 GHz networks, which carry most traffic in a modern home, don't appear at all.</p>
  <p><b>Security labels.</b> Three firmware builds labeled security three different ways. The first, through April 14, wrote "WPA2" for every network, open ones included, so the ${fmt(SEC.unknown)} networks heard only in that period have no usable label. Most sessions recorded open or not open, and so does every Cardputer session. Five T-Deck sessions on May 11–15 recorded the actual protocol. The figures below use each label only where it means something.</p>
  <p>Of the <b>${fmt(SEC.known)} networks with a usable label</b>: ${fmt(SEC.secured_named)} are named and secured (${pct1(SEC.secured_named,SEC.known)}%), ${fmt(SEC.open_named)} are named and open (${pct1(SEC.open_named,SEC.known)}%), and ${fmt(SEC.hidden)} hide their name (${pct1(SEC.hidden,SEC.known)}%). A further ${fmt(SEC.open_hidden)} are both hidden and open, and ${fmt(eero)} of those are eero mesh units: each one broadcasts a second, hidden, unencrypted network for its own setup and mesh links. That isn't an open door into the home network, and it is counted under hidden.</p>
  <p>In the five sessions that recorded the protocol (${fmt(SEC.detail_n)} networks): <b>WPA2 on ${pct(SEC.wpa2,SEC.detail_n)}%</b>, WPA3 offered on <b>${pct1(SEC.wpa3_capable,SEC.detail_n)}%</b> (nearly all in WPA2/WPA3 transition mode; ${SEC.wpa3_only} are WPA3-only), old WPA still accepted alongside WPA2 on ${pct1(SEC.mixed,SEC.detail_n)}%, open ${pct1(SEC.open_detail,SEC.detail_n)}%. <b>${SEC.wep} networks still run WEP</b>, which can be broken in minutes, and ${SEC.wpa1} run first-generation WPA only.</p>
  <p><b>Open networks</b> are mostly deliberate guest and public service: ${R.open_top.filter(o=>!/_EXT|Extender/i.test(o[0])).slice(0,8).map(o=>o[0]).join(', ')}. The risky exception is factory-default range extenders left open (${ext.map(o=>o[0]+' ×'+o[1]).join(', ')}), which pass traffic from the owner's home network to anyone nearby.</p>
  <p><b>Channel 14.</b> ${fmt(c14.total)} access points sat on channel 14, which no US device is licensed to use. They are not a mix: ${fmt(juan)} carry addresses registered to wireless camera makers (Guangzhou Juan and AltoBeam) and ${fmt(c14.camera_named)} have camera or recorder names. These are budget camera kits linking a recorder to its cameras on a channel nobody else is on. They are not Espressif hardware.</p>
  <p><b>ISP census.</b> Default router names give away the provider. In Los Angeles <b>${ispLA[0][0]}</b> dominates with ${fmt(ispLA[0][1])} default-named networks, ahead of ${ispLA.slice(1,4).map(i=>i[0]+' ('+fmt(i[1])+')').join(', ')}.</p>`);
  const w2=el('div','two');
  w2.append(chart('Networks by channel','2.4 GHz, all '+fmt(S.totals.wifi_devices)+' networks',svgBars(R.channels.map(c=>({k:c[0],v:c[1]})),{label:k=>k,colorFn:r=>r.k===14?cssv('--crit'):(r.k===1||r.k===6||r.k===11)?cssv('--wifi-sec'):cssv('--ink3')}),'Blue: the three channels that don\'t overlap. Gray: the overlapping ones in between. Red: channel 14.'));
  const w2b=el('div');w2b.append(table(['Provider (default name pattern)','Networks'],ispLA.filter(i=>i[1]>0).map(i=>[i[0],fmt(i[1])]),[1]));w2.append(w2b);
  s.append(w2);

  // 8 vehicles
  s=S_('road','8 · Company on the road');
  const cab=cls('rode in the cabin'),tr1=cls('intermittent'),tr2=cls('alongside'),ownc=cls('own car'),flt=cls('fleet Tesla');
  P(s,`<p>The road is one of the densest radio environments in the data. ${fmt(V.moving_wifi)} Wi-Fi access points moved more than 500 m while in range: cars, buses and phone hotspots.</p>
  <ul><li><b>${fmt(V.teslas)} distinct Teslas.</b> Each broadcasts a stable Bluetooth name derived from its VIN, so this is a count of cars. ${fmt(V.teslas_once)} were heard on one day only.</li>
  <li><b>${fmt(V.limes)} Lime scooters and e-bikes</b>, each by its own vehicle number.</li>
  <li><b>${fmt(R.gm_numbered)} GM vehicles</b> by numbered hotspot name (CHEVROLET####, GMC####), plus ${fmt(R.gm_generic)} sightings of the generic "myChevrolet"-style hotspots, which can't be told apart.</li>
  <li><b>${fmt(V.dashcams)} dashcams</b> and <b>${fmt(V.fleet_telematics)}</b> fleet-telematics units (Samsara, Cradlepoint, Netradyne and similar) on commercial vehicles and buses.</li>
  <li><b>${fmt(AL.cars)} Alto</b> cars, ${uber.devices} Uber Beacons and ${lyft.devices} Lyft Amps.</li></ul>
  <p>The <a href="#transit">Transit tab</a> breaks these down by service and by how they move. Two results stand out. Lime scooters churn: ${LI.stay_by_gap[0].stayed_pct}% of those seen again the next day were still within 100 m, and ${LI.stay_by_gap[2].stayed_pct}% of those seen again four to seven days later. And of the ${AL.repeat.cars} Alto cars met on more than one day, only ${AL.repeat.same_500} were met within 500 m of an earlier meeting.</p>
  <p>That's why "something is following me" is usually traffic. Across all drives, <b>${fmt(tr1.devices)}</b> devices kept intermittent pace with the car for at least 10 minutes and 3 km and never appeared again, and ${fmt(tr2.devices)} more rode alongside for part of a trip. A further ${fmt(cab.devices)} were strong, steady signals inside the car for ten minutes or more: the driver's phone under a fresh address, or a rider's.</p>`);

  // 9 ESP32
  s=S_('iot','9 · ESP32 boards and what they were doing');
  const EF=n=>E.families.find(f=>f.product.indexOf(n)>=0)||{n:0,open:0,mobile:0,multiday:0};
  P(s,`<p><b>${fmt(E.total)} Espressif-based devices</b> were heard, not counting the project's own: ${fmt(E.registered_boards)} boards on addresses registered to Espressif (${fmt(E.ble)} over Bluetooth, ${fmt(E.wifi)} as Wi-Fi access points, ${E.both_radios} on both) and ${fmt(E.la_form)} more running the kind of Wi-Fi hotspot older ESP modules create. ${pct(E.fixed,E.radios)}% never moved and ${fmt(E.once)} were heard only once or twice: home devices caught in passing.</p>
  <ul><li><b>Most are appliances waiting for their owner's phone:</b> ${EF('Levoit').n} Levoit and Cosori units, ${EF('Govee').n} Govee devices, purifiers, fans, coffee machines.</li>
  <li><b>${E.behaviour.setup} were broadcasting an open hotspot,</b> which usually means setup was never finished: ${EF('Tineco').open} Tineco floor washers, ${EF('Smart Life').open} Tuya "Smart Life" plugs, ${EF('Windmill').open} Windmill air conditioners. ${E.behaviour.setup_multiday} were still like that on a second day.</li>
  <li><b>${pct(E.channels.esp_ch1,E.channels.esp_wifi)}% of ESP access points sit on channel 1,</b> the chip's default, against ${pct(E.channels.other_ch1,E.channels.other_wifi)}% of other networks.</li>
  <li><b>The movers are fleets and vehicles:</b> Lime scooters, Netradyne dashcams and IOSiX loggers on trucks, a handful of units that roam the city and cross the car's path days apart.</li>
  <li><b>${EF('Factory-default').n} boards still carry a factory name</b> like "ESP32" or "ESP_xxxxxx", and ${EF('AI-Thinker').n} run stock AI-Thinker firmware.</li></ul>
  <p>None travelled with the car, none imitates a public network, and none carries an attack-tool name. The two recorders and the project's other ESP32 nodes don't appear at all, because none of them advertise. The ESP32 tab has the identification table.</p>`);

  // 10 LoRa
  if(L.packets){s=S_('lora','10 · LoRa and Meshtastic');
  const ld=L.days.map(d=>longDate(d[0])+': '+d[1]+' packets / '+d[2]+' nodes').join('; ');
  P(s,`<p>The LoRa receiver did work. It logged <b>${L.packets} Meshtastic packets from ${L.nodes} distinct nodes</b>, all during the Portland week (${ld}). ${L.relay} of the ${L.packets} were relays of someone else's traffic, received near the radio's floor: median ${L.rssi[1]} dBm, best ${L.rssi[2]} dBm. No LoRa packets were logged in the Los Angeles sessions. Positions on these rows are where the packet was heard, not where the node sits.</p>`);}

  // 11 footprint
  s=S_('footprint','11 · The recorders\' own radio footprint');
  P(s,`<p>${BD.T.files} sessions were recorded on the <b>T-Deck Plus</b> and ${BD.C.files} on the <b>Cardputer</b>. The absence of the project's own ESP32 nodes is good news: nothing in the kit advertises. No access-point beacons and no Bluetooth advertisements came from either recorder or from the other nodes, so a passive scanner can't see them. Two transmissions remain, both from scanning:</p>
  <ul><li><b>Wi-Fi scans are active.</b> The T-Deck Plus build calls <code>WiFi.scanNetworks(false, true)</code>, which defaults to an active scan, and the Cardputer build starts its scans in the same default mode. Every sweep sends probe requests carrying the board's own Espressif address. These logs don't record probe requests, which is why this data can't show them, but anyone running a probe sniffer would see that same address wherever the car goes.</li>
  <li><b>The T-Deck's Bluetooth scan is active</b> (<code>setActiveScan(true)</code>): it sends scan requests to devices that advertise. <b>The Cardputer's is passive, and the data shows it.</b> In ${fmt(BD.C.rows)} rows it never recorded a name that lives in a scan response: it heard ${fmt(CP.names.tesla_addr_c_all)} of the Teslas the T-Deck knows and named none of them.</li></ul>
  <p><b>To go fully passive on the T-Deck Plus:</b> call <code>WiFi.scanNetworks(false, true, true, 120)</code> (passive, about 120 ms per channel) and switch its Bluetooth scan to <code>setActiveScan(false)</code>. Expect slower Wi-Fi sweeps and fewer Bluetooth device names, since some names only arrive in scan responses: the Cardputer named ${CP.names.ble_named_pct_c}% of the Bluetooth addresses it heard on the shared drives against the T-Deck's ${CP.names.ble_named_pct_t}%. If active Wi-Fi scanning is kept, randomizing the station address each session removes the stable fingerprint.</p>
  <p><b>What the driver carries does show.</b> The cabin count in section 4 is also a picture of the driver: about ${RD.baseline[0][0]} steady Bluetooth signals ride along on a typical shift, the car's and the driver's own phone's among them. They rotate address on a timer, many of them exactly on the quarter hour, so nobody can follow one across days by address. Anyone standing next to the car can still count them.</p>`);

  // 12 threat recap
  s=S_('threats','12 · Threat search, in brief');
  P(s,`<p><b>No persistent tail.</b> Only the driver's own car and the ${CT.multi_day.filter(m=>/fleet Tesla/.test(m.what)).length===1?'one fleet Tesla':CT.multi_day.filter(m=>/fleet Tesla/.test(m.what)).length+' fleet Teslas'} driven twice travelled with the recorders on more than one day. The longest any unidentified device stayed alongside was ${TS.longest_unknown_min} minutes. <b>No attack hardware:</b> no Pineapple, Flipper or attack-firmware signature, and all ${fmt(TS.joke_ssids)} alarming network names (from "FBI Surveillance Van" to "Pineapple") sat on ordinary home routers. <b>Surveillance infrastructure is present:</b> ${TS.flock_devices} Flock license-plate-reader indicators at fixed sites and ${TS.axon_devices} Axon units from passing or parked officers; none appeared on a second day and none stayed in range while the car moved. <b>${fmt(TS.recurring_devices)} devices did turn up on three or more days</b> away from the depot. Every one is a scooter, a bus, a fleet car, another driver working the same streets, or a product whose units all share one address. <b>The GPS faults</b> were coordinate errors: during the May 7 jump the scanner kept hearing ${A.evidence.map(e=>e.seen_in_window+' '+(e.type==='WIFI'?'Wi-Fi':'Bluetooth')).join(' and ')} devices it hears wherever it is usually parked.</p>`);
  const tl=el('p');const ta=el('a',null,'Open the full threat search →');ta.href='#threats';ta.style.cssText='font-family:var(--disp);font-weight:600';tl.append(ta);s.append(tl);

  // 13 data notes
  s=S_('notes','13 · Data notes');
  const Q=S.quality;
  P(s,`<p>${S.totals.source_files} CSV files (${BD.T.source_files} from the T-Deck Plus, ${BD.C.source_files} from the Cardputer), of which ${S.totals.empty_files} held only a header (a session that never got a GPS fix), leaving ${S.totals.files} sessions. Of ${fmt(Q.lines)} data lines, ${fmt(S.totals.rows)} were kept and ${fmt(Q.dropped_unreadable)} dropped as unreadable. ${fmt(Q.recovered_no_address)} of the kept rows are Bluetooth sightings whose address the firmware had overwritten with the device's name; they are kept by name. Wi-Fi and Bluetooth are separated by type. Rows recorded inside two private areas were removed before anything was counted (see Method). GPS was limited to California and Oregon and checked three ways. Bluetooth totals are a floor, because the firmware records at most 31 advertisements per scan and ${pct(Q.ble_scans_at_cap,Q.ble_scans)}% of scans hit that cap. The Cardputer also keeps at most 24 Wi-Fi networks per scan. The Two recorders tab has the differences. Street and neighborhood names: © OpenStreetMap contributors, via Nominatim. Device positions are strength-weighted estimates, accurate to about a block for strong fixed transmitters.</p>`);

  secs.forEach(([id,title,node])=>{const b=el('button',null,title.replace(/^\d+ · /,''));b.onclick=()=>node.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});toc.append(b);sec.append(node);});
  sec.append(mapLink('Open the full map with the high-RF regions and frequented roads →',['regions','roads']));
  sec.append(footer());stage.append(sec);await mapBlock(mh,{inline:true,on:['regions','roads']});
}

  const c2=el('div','prose');c2.innerHTML=`<p><b>Waiting for a phone (${fmt(B.ble_named+B.ble_anon)}).</b> The resting state of a smart appliance: it advertises over Bluetooth a few times a second so its owner's app can find it. A passing recorder hears it for the seconds it is in range.</p>

/* ---------- two-series helpers (recorder comparisons) ---------- */
function legendRow(items){return '<div class="lg">'+items.map(i=>`<span><i style="background:${cssv(i.tok)}"></i>${i.name}</span>`).join('')+'</div>';}
/* lines on one axis: rows [{k,...}], series [{key,name,tok}]; end labels are nudged apart when they would collide */
function svgLines(rows,series,{h=200,unit='',label=(k,i)=>k,max=null,breaks=[],at='end'}={}){
  const n=rows.length,pad=40,top=14,bot=22,right=104,w=Math.max(560,Math.min(940,n*13+pad+right));
  const mx=max||niceMax(Math.max(1,...rows.flatMap(r=>series.map(s=>r[s.key]||0)))),ph=h-top-bot,pw=w-pad-right;
  const X=i=>pad+(n>1?pw*i/(n-1):pw/2),Y=v=>top+ph*(1-Math.min(v,mx)/mx);
  let s=`<svg class="spark" style="max-width:${Math.round(w*1.3)}px" viewBox="0 0 ${w} ${h}" role="img" aria-label="line chart">`;
  for(let g=0;g<=2;g++){const y=top+ph*(1-g/2);
    s+=`<line x1="${pad}" y1="${y}" x2="${w-right}" y2="${y}" stroke="${cssv('--line')}" stroke-width="1"/>`;
    s+=`<text x="${pad-5}" y="${y+3.5}" text-anchor="end" font-size="10" font-family="var(--mono)" fill="${cssv('--ink3')}">${compact(mx*g/2)}</text>`;}
  breaks.forEach(i=>{const x=(X(i-1)+X(i))/2;s+=`<line x1="${x}" y1="${top}" x2="${x}" y2="${top+ph}" stroke="${cssv('--ink3')}" stroke-width="1" stroke-dasharray="3 3"/>`;});
  rows.forEach((r,i)=>{const lb=label(r.k,i);if(lb!=='')s+=`<text x="${X(i).toFixed(1)}" y="${h-5}" text-anchor="middle" font-size="10.5" font-family="var(--mono)" fill="${cssv('--ink2')}">${lb}</text>`;});
  const ends=[];
  series.forEach(se=>{const c=cssv(se.tok);let d='',pen=false,last=null;
    rows.forEach((r,i)=>{const v=r[se.key];if(v==null||breaks.includes(i)){pen=false;}if(v==null)return;d+=(pen?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);pen=true;last=[X(i),Y(v)];});
    s+=`<path d="${d}" fill="none" stroke="${c}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    if(at==='peak'){let bi=0;rows.forEach((r,i)=>{if((r[se.key]||0)>(rows[bi][se.key]||0))bi=i;});last=[X(bi),Y(rows[bi][se.key]||0)];}
    if(last){s+=`<circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="4" fill="${c}" stroke="${cssv('--panel')}" stroke-width="2"/>`;ends.push({x:last[0],y:last[1],name:se.name});}});
  if(at==='peak'){ends.sort((a,b)=>a.x-b.x);ends.forEach((e,i)=>{const left=i===0&&ends.length>1;s+=`<text x="${(e.x+(left?-9:9)).toFixed(1)}" y="${(e.y-4).toFixed(1)}" text-anchor="${left?'end':'start'}" font-size="11" font-family="var(--sans)" fill="${cssv('--ink')}">${e.name}</text>`;});}
  else{ends.sort((a,b)=>a.y-b.y);for(let i=1;i<ends.length;i++)if(ends[i].y-ends[i-1].y<13)ends[i].y=ends[i-1].y+13;
  ends.forEach(e=>{s+=`<text x="${(e.x+9).toFixed(1)}" y="${(e.y+3.5).toFixed(1)}" font-size="11" font-family="var(--sans)" fill="${cssv('--ink')}">${e.name}</text>`;});}
  series.forEach(se=>rows.forEach((r,i)=>{if(r[se.key]==null)return;s+=`<circle cx="${X(i).toFixed(1)}" cy="${Y(r[se.key]).toFixed(1)}" r="7" fill="transparent"><title>${r.k} · ${se.name}: ${fmt(r[se.key])}${unit}</title></circle>`;}));
  return s+'</svg>';
}
/* one bar split into shares, with the shares labeled underneath */
function splitBar(title,parts){const tot=parts.reduce((a,p)=>a+p.v,0)||1;
  return `<div class="splith">${title}</div><div class="split">`+parts.map(p=>`<span style="flex:${p.v} 1 0;background:${cssv(p.tok)}" title="${p.name}: ${fmt(p.v)} (${Math.round(100*p.v/tot)}%)"></span>`).join('')+'</div><div class="splitl">'+parts.map(p=>`<span><i style="background:${cssv(p.tok)}"></i>${p.name} <b>${Math.round(100*p.v/tot)}%</b> <em>${fmt(p.v)}</em></span>`).join('')+'</div>';}
const DEVS=[{key:'t',name:'T-Deck Plus',tok:'--dev-t'},{key:'c',name:'Cardputer',tok:'--dev-c'}];
const andList=a=>a.length<2?a.join(''):a.slice(0,-1).join(', ')+' and '+a[a.length-1];
const more=(c,t)=>{const r=Math.round(100*(c/t-1));return r>=0?r+'% more':Math.abs(r)+'% fewer';};

  sec.append(tw2);
  P(sec,`<p><b>Where, per hour spent there.</b> Raw counts mostly show where this car drives, so the table divides by its own time in each area. Overall ${OV.tower_per_h} Tower cars and ${OV.alto_per_h} Altos were met per field hour.</p>`);
  sec.append(table(['Area','Hours there','Tower cars met','Tower per hour','Alto cars met','Alto per hour'],TW.areas.filter(a=>a.hours>=2.5).slice(0,18).map(a=>[a.area,a.hours.toFixed(1),a.tower,a.tower_per_h.toFixed(2),a.alto,a.alto_per_h.toFixed(2)]),[1,2,3,4,5]));
  P(sec,`<p><b>The airport is where both fleets pile up:</b> ${lax.tower_per_h} Tower cars and ${lax.alto_per_h} Altos for every hour spent around LAX, three to four times the overall rate for each. Lincoln Heights is high for Tower only because it is the road to the yard. Past those two the fleets part ways. Alto is thick through Hollywood, Beverly Hills, Palms, Culver City and Koreatown, at two to three cars an hour, where Tower cars are scarce. Tower cars turn up relatively more downtown, in the Arts District and in South LA. Across ${TW.area_n} areas the two rates only loosely track each other (correlation ${TW.area_corr}).</p>
  <p><b>Do Tower cars coincide with Altos? About twice as often as chance.</b> At ${WA.tower_with_alto} of the ${WA.tower_n} Tower meetings an Alto was also met within 500 m and ten minutes (${WA.tower_pct}%). Take a random minute of field driving on the same days and that happens ${WA.random_alto_pct}% of the time. From the Alto side: ${WA.alto_with_tower} of ${WA.alto_n} Alto meetings had a Tower car that close (${WA.alto_pct}%), against ${WA.random_tower_pct}% at random. Widened to 1 km and 15 minutes the lift is ${WB.lift_alto} to ${WB.lift_tower} times. It happened on ${TW.both_days} days.</p>`);
  sec.append(table(['Date','Time','Where a Tower car and an Alto were met together','Altos within 500 m and 10 min'],TW.both_list.map(b=>[mono(b.day.slice(5)),b.time,b.where,b.altos]),[3]));
  P(sec,`<p><b>Reading it as demand.</b> A place where both fleets keep turning up while this car is only passing through is a place two separate dispatch systems keep sending cars. LAX qualifies on every measure here, and Lincoln Boulevard through Santa Monica and Marina del Rey shows up in the table above more than once. Two cautions. The per-hour rates rest on 2 to 20 hours in each area, so a difference of half a car an hour is noise. And a meeting within a few kilometers of the yard at 9 or 5 is a colleague commuting, not a fare.</p>
  <p><b>Running together, parked together.</b> ${TW.together.length} times another Tower car stayed in range while the car covered 400 m or more, the longest on ${longDate(TW.together[0].day)} at ${TW.together[0].start}: ${TW.together[0].km} km along the ${TW.together[0].frm.split(',')[0]}. ${TW.parked.length} times one sat beside the car for five minutes or more: ${TW.parked.slice().sort((x,y)=>(x.day+x.start).localeCompare(y.day+y.start)).map((p,i,arr)=>longDate(p.day)+' from '+p.start+' for '+p.mins+' minutes on '+p.where+((p.teslas_there>=20&&arr.findIndex(q=>q.day===p.day&&q.where===p.where)===i)?' ('+p.teslas_there+' Teslas were in range there that day, which reads as a charging site)':'')).join('; ')}.</p>
  <p><b>Plates and plate sequences: not in this data.</b> Cars on TCP plates would seem easy to pick out, and over Bluetooth Low Energy they are not. A Tesla advertises an 18-character name built from a hash of its VIN, so two Tower cars' names look no more alike than any two Teslas', and consecutive plates or VINs leave no pattern in them. All ${fmt(TW.plate_search.names_checked)} distinct names in both logs were checked: ${TW.plate_search.plate_format===0?'none is':TW.plate_search.plate_format+' are'} in California plate format, and no vehicle carries "TCP". If the cars show a plate or unit number as their name when a phone is paired, that goes out over classic Bluetooth, which neither recorder scans.</p>
  <p>So a Tower car is identified here by the yard, and that means the Mission Road cars only. <b>The La Cienega/Douglas cars are in the data but can't be told apart.</b> They are somewhere among the ${fmt(TW.all_teslas_field)} Teslas met in the field, ${TW.other_recurring.three_plus} of which are not Mission cars and were met on three or more days, which is what a working car looks like. Nowhere else in the logs do the same Teslas keep returning the way ${TW.second_yard.mission_repeat3} do at Mission Road; the next best spot has ${TW.second_yard.best_cell_repeat_teslas}. One slow pass by that yard with a recorder running would fingerprint its cars the same way, and they would then light up in every earlier log.</p>`);

  // Lime
  sec.append(el('h3','sh','Lime, and the other scooters'));
  P(sec,`<p><b>${fmt(LM.scooters)} Lime scooters and e-bikes</b>, each counted by the vehicle number in its Bluetooth name, on ${LM.days} days. Three hardware generations are on the street: of the ${fmt(LM.with_address)} with a readable address, ${LM.hardware.slice(0,3).map(h=>fmt(h[1])+' use '+co(h[0]).replace(' Wireless Solutions','')+' radios').join(', ')}. Another ${fam('micro','Queclink').n} Bluetooth devices sit on Queclink tracker addresses, most named "ZK" plus a number: the tracker other shared-scooter and e-bike operators fit. They cluster around ${(W.queclink||[]).slice(0,2).map(x=>x.name).join(' and ')}. ${fam('micro','Bird').n} units answered to "Bird", and ${fam('micro','Ninebot').n+fam('micro','Segway').n} privately owned Ninebot and Segway scooters were heard.</p>`);
  const t2=el('div','two');
  const lc=el('div','card');lc.append(el('h4',null,'Where the Lime fleet was'),el('div','sub','scooters heard, by neighborhood'));barList(lc,LM.areas.slice(0,10).map(a=>({k:a.name,v:a.scooters,c:cssv('--t-micro')})));t2.append(lc);
  t2.append(chart('Still where it was?','Lime scooters seen again: share within 100 m of the earlier spot',svgBars(LM.stay_by_gap.map(g=>({k:g.gap,v:g.stayed_pct})),{unit:'%',max:100,label:k=>k.replace(' days','d').replace('next day','next day')}),

  sec.append(t2);
  P(sec,`<p><b>They don't stay put.</b> ${fmt(LM.by_days.filter(d=>d.days>1).reduce((a,d)=>a+d.scooters,0))} Lime vehicles were heard on more than one day, giving ${fmt(LM.between_days.pairs)} pairs of sightings on different days. In only ${LM.between_days.stayed_100} of them was the scooter within 100 m of where it had been. ${fmt(LM.between_days.moved_300)} had moved 300 m or more: a median ${LM.between_days.median_km} km, a tenth of them more than ${LM.between_days.p90_km} km, the farthest ${LM.between_days.max_km} km. Seen again the next day, ${LM.stay_by_gap[0].stayed_pct}% were still in place; after four to seven days, ${LM.stay_by_gap[2].stayed_pct}%; after three weeks, none.</p>

  <p><b>Keeping pace with the car? Not that this data can show.</b> A parked scooter is in range for seconds: ${fmt(LM.heard_secs.once[0])} of ${fmt(LM.heard_secs.once[1])} sightings are a single scan and nine in ten last under ${Math.round(LM.heard_secs.p90)} seconds. ${LM.pacing.over_250} sightings stretched across 250 m or more of the car's path. Household Bluetooth gear, which doesn't ride anywhere, does that as often: ${LM.pacing.control_over_300} of ${fmt(LM.pacing.control_runs)} light strips and TVs were heard across 300 m, against ${LM.pacing.over_300} of ${fmt(LM.pacing.runs)} scooters. Long reach down a straight street explains them. The mobility in the Lime data is between sightings, not alongside the car.</p>`);
  sec.append(table(['The longest Lime sightings','Start','Heard for','Along the path','Car speed','Scans','Peak signal','Where it began'],LM.pacing.cases.map(c=>[mono(c.day),c.start,c.secs+' s',c.m+' m',c.kmh+' km/h',c.hears,c.rssi+' dBm',c.where]),[2,3,4,5,6]));
  P(sec,`<p><b>How many are out there.</b> ${fmt(LM.by_days[0].scooters)} Lime vehicles were seen on one day and ${fmt(LM.by_days[1].scooters)} on two. By the same reasoning as for Alto, that points to roughly <b>${fmt(Math.round(LM.chao1/100)*100)} or more</b> in the districts driven. Treat it loosely: scooters are retired and added over eleven weeks, and downtown was sampled far more often than anywhere else.</p>`);

  // Uber, Lyft, taxis

  const rf=cat('ride').fams,tf=cat('taxi').fams;

  sec.append(table(['','Devices','Heard on 2+ days','Seen 500 m+ apart','Travelled alongside'],[...rf,...tf].map(f=>[f.fam,f.n,f.multi_day||'',f.movers||'',f.along||'']),[1,2,3,4]));

  P(sec,`<p><b>LADOT's buses carry passenger Wi-Fi with the agency's name on it.</b> ${ld.n} of them were heard, ${ld.multi_day} on more than one day, thickest around ${W.ladot.slice(0,3).map(x=>x.name).join(', ')}: the DASH downtown loops and the Commuter Express stops. <b>Metro Rail</b> accounts for ${mr.n} radios named MetroRailFreeWiFi, ${mr.movers} of which moved, so those are trains; the rest are stations (${W.metro.slice(0,3).map(x=>x.name).join(', ')}). The FlyAway airport bus (${fam('bus','FlyAway').n}) turns up at ${W.flyaway[0].name}, and ${fam('bus','Tour').n} tour, charter and intercity coaches carry names such as Big Bus Tours, Starline, FlixBus and Greyhound.</p>
  <p><b>Metro's own buses don't name themselves, but something on them probably does.</b> ${lb.n} radios on MikroTik hardware share the network name "LABSP". ${lb.movers} of them moved and ${lb.multi_day} were heard on more than one day, and they travelled alongside more than anything else in this group: ${lb.along} of them kept pace for 800 m or more, ${(TR.along_repeat.find(x=>x.cat==='bus')||{devices:0}).devices} of those on more than one day. Los Angeles runs a bus signal-priority system in which buses ask traffic signals for a green over a wireless link at more than 600 intersections, and "LA BSP" fits it. That reading is an inference from the name and the behavior, not a confirmed identification. The ${lb.n-lb.movers} that never moved would be the intersection end.</p>`);
  sec.append(table(['','Radios','Heard on 2+ days','Seen 500 m+ apart','Travelled alongside'],cat('bus').fams.map(f=>[f.fam,f.n,f.multi_day||'',f.movers||'',f.along||'']),[1,2,3,4]));

  const fb=el('div');fb.append(table(['Fleet name on a Samsara gateway','Gateways'],TR.fleets.slice(0,12).map(f=>[f.name,f.n]),[1]));f2.append(fb);

  sec.append(table(['Dashcam brand','Devices','2+ days','Seen 500 m+ apart','Travelled alongside'],cat('dash').fams.map(f=>[f.fam,fmt(f.n),f.multi_day||'',f.movers||'',f.along||'']),[1,2,3,4]));
  const sh=cat('share').fams;

  // travelled with you
  sec.append(el('h3','sh','What travelled alongside, and for how long'));
  P(sec,`<p>${TR.along_sum.runs} times a named vehicle device stayed in range while the car covered 800 m or more, ${TR.along_sum.devices} different devices in all. The typical case lasted ${TR.along_sum.med_min.toFixed(1)} minutes over ${TR.along_sum.med_km.toFixed(1)} km: the same lane of the same freeway. The only devices that rode along for 20 minutes or more were the driver's own car's.</p>`);

  const AR=TR.along_repeat||[],ARD=TR.along_repeat_detail||[],arBus=AR.filter(x=>x.cat==='bus').reduce((a,x)=>a+x.devices,0);

    P(sec,`<p><b>Company on more than one day.</b> ${AR.reduce((a,x)=>a+x.devices,0)} of those devices did it on two or more different days. ${arBus} are "LABSP" radios, which is buses on streets driven again and again. The other ${ARD.length} are dashcams, and they are worth a look:</p>`);
    const rowsD=[];ARD.forEach((d,i)=>d.runs.filter(r=>r.with_you).forEach((r,j)=>rowsD.push([j===0?'Dashcam '+String.fromCharCode(65+i)+' <span class="tag">'+d.days_seen+' days seen</span>':'',mono(r.day),r.start,r.mins,r.km+' km',r.rssi+' dBm',r.frm+' → '+r.to,r.depot_km+' km'])));

  }

  <p><b>8Fleet.</b> Nothing carries its name. 8Fleet puts employed drivers in company cars on the rideshare apps, so its cars would look like any other car here unless they carry a fleet tracker, and a tracker's default name doesn't say whose car it is. Knowing what telematics its cars use would give a name pattern to search for.</p>
  <p><b>Metro buses, Foothill Transit, Culver CityBus, Big Blue Bus.</b> No passenger Wi-Fi with those names, apart from ${fam('bus','Big Blue').n} Big Blue Bus radios. Either the buses don't offer 2.4 GHz Wi-Fi or it carries a name that doesn't identify the operator.</p>`);

  sec.append(el('h3','sh','Fleets on the map'));const mh=el('div','maphost');sec.append(mh);sec.append(mapLink('Open the full map with Tower, Alto, Lime, buses, fleets and dashcams →',['t_tower','t_alto','t_ride','t_bus']));

function mapLink(txt,layers){const p=el('p');const a=el('a',null,txt);a.href='#map';if(layers)a.onclick=()=>{window.__PMON=layers;};a.style.cssText='font-family:var(--disp);font-weight:600;font-size:13px';p.style.marginTop='14px';p.append(a);return p;}
function footer(){return el('footer',null,'Pisces Moon Signals Atlas · Los Angeles · wardrive sessions recorded on a T-Deck Plus and a Cardputer, March to June 2026 · Wi-Fi and Bluetooth separated by type · two private areas, home and personal names and full device addresses withheld · street map © OpenStreetMap contributors. Device locations are strength-weighted estimates, not exact positions.');}

function mapBlock(host,opt){opt=opt||{};
  const wrap=el('div');wrap.id='mapwrap';if(opt.inline)wrap.className='inl';
  wrap.innerHTML=`<div id="map"></div>
    <div class="maptools"><details class="layerbox"${opt.inline?'':' open'}><summary>Layers</summary><div class="lyrs" id="lyrs"></div></details></div>
    <div class="scan"><button id="toLA">Whole area</button><button id="toDT">Downtown</button></div>
    <div id="detail"><button class="x" id="detx" aria-label="Close">×</button><div id="detbody"></div></div>
    <div id="legend"></div>`;
  host.append(wrap);
  const hint=el('p','hint','');hint.id='maphint';host.append(hint);
  if(!window.L){$('#map').innerHTML='<p style="padding:20px">The map library didn\'t load. Reload the page to try again.</p>';return;}
  if(opt.on)window.__PMON=opt.on;window.__PMOFF=opt.off||null;
  return initMap();
}
function viewMap(){
  const sec=el('section');sec.style.paddingBottom='10px';
  sec.append(el('div','eyebrow','Interactive map · Los Angeles'));
  sec.append(el('h2','vh','The signals map'));
  sec.append(el('p','lead','Toggle layers on the left. Click a Wi-Fi or Bluetooth dot to see what kind of device it is, or a transit mark to see every place that unit was met. The street map is bundled with the page: it covers the roads that were driven and stops at zoom 15.'));
  stage.append(sec);
  return mapBlock(sec,{});
}

async function initMap(){
  const map=L.map('map',{preferCanvas:true,zoomControl:true,attributionControl:true,minZoom:9,maxZoom:15,maxBounds:[[33.35,-119.1],[34.75,-117.0]],maxBoundsViscosity:.7}).setView([34.03,-118.30],$('#mapwrap').classList.contains('inl')?10:11);
  map.attributionControl.setPrefix(false);
  window.MAP={restyle(){},map};
  const pane=map.getPanes().overlayPane;
  const cv=document.createElement('canvas');cv.style.position='absolute';pane.appendChild(cv);
  const ctx=cv.getContext('2d');const dpr=Math.min(2,window.devicePixelRatio||1);
  const [geo,tracks,dens,routes,esp,AN,ST,R]=await Promise.all([J('geo.json'),J('tracks.json'),J('density.json'),J('routes.json'),J('esp32.json'),J('anomaly.json'),J('stops.json'),J('report.json')]);
  const [wpos,wattr,bpos,battr]=await Promise.all([BUF('wifi_pos.txt'),BUF('wifi_attr.txt'),BUF('ble_pos.txt'),BUF('ble_attr.txt')]);
  const WP=new Int32Array(wpos),WA=new Uint8Array(wattr),BP=new Int32Array(bpos);
  const S=await J('summary.json');const CH=S.map.chunk;

          if(d.area){const ar='M'+x(.5*cfg.bin)+' '+yb+vals.map((v,b)=>'L'+x((b+.5)*cfg.bin).toFixed(1)+' '+y(v||mn).toFixed(1)).join('')+'L'+x((vals.length-.5)*cfg.bin)+' '+yb+'Z';S('path',{d:ar,fill:d.color,opacity:.22},svg);}

    });

      <p>${L.files} sessions on two recorders, a T-Deck Plus and a Cardputer, mostly across fleet-car shifts out of an East LA depot: the roads, the densest radio districts, the fleets and scooters on the air, and a full threat search.</p>
      <div class="sh-stats"><div><b>${fmt(L.wifi_devices)}</b><span>Wi-Fi networks</span></div><div><b>${fmt(L.ble_devices)}</b><span>Bluetooth addresses</span></div><div><b>${L.days}</b><span>days with data</span></div></div><span class="go">Open Los Angeles →</span></a>
      <a class="sh-card" href="#pdx"><div class="ey">Portland · November</div><h3>Portland, and the Clinician field tests</h3>
      <p>A week of driving on the west side, ${day(P.first)} – ${day(P.last)}, then two runs of a three-board rig: a commute and a five-hour lap of the city that found airport shuttles, a bus by its passengers' phones and a dozen strangers on the LoRa mesh.</p>
      <div class="sh-stats"><div><b>2</b><span>field-test runs</span></div><div><b>${fmt(P.wifi_devices)}</b><span>Wi-Fi in the week</span></div><div><b>${P.days}</b><span>days of driving</span></div></div><span class="go">Open Portland →</span></a>`;
  }).catch(e=>{hc.innerHTML='<p>The summary figures did not load ('+e.message+').</p>';});
}
function pagePdx(){
  const d=wrap(`<div class="ey">Portland · November 2026</div><h1>Portland</h1>
  <p class="lead">The later work: a first week of driving around Beaverton, Tigard and the west side with the T-Deck Plus, then two field tests of the Clinician, a rig of three boards feeding one bridge.</p>
  <div class="sh-stats" id="pst"></div>
  <div id="shmap" role="img" aria-label="Map of the Portland drives"></div>
  <div class="sh-lg"><span><i style="background:var(--sh-ink3)"></i>First week, Nov 9–15</span><span><i style="background:var(--sh-acc)"></i>Field test run 1</span><span><i style="background:var(--sh-acc2)"></i>Field test run 2</span></div>
  <p style="font-size:13px;color:var(--sh-ink3);margin-top:8px">Tracks stop at the edge of a private area on the west side.</p>
  <h2>The Clinician field tests</h2>
  <div class="sh-cards">
   <a class="sh-card" href="#r1"><div class="ey">Run 1 · Sat 21 Nov</div><h3>The commute</h3><p>Nine and a half hours: US 26 out to a work site, the afternoon parked, surface streets back. How the three boards behaved, why two of them restarted, and what announced itself along the way.</p><span class="go">Run 1 →</span></a>
   <a class="sh-card" href="#r2"><div class="ey">Run 2 · Sun 22 Nov</div><h3>A lap of Portland</h3><p>149 km over the West Hills, through downtown, out to the airport and back across North Portland: LoRa strangers, six shuttle buses, a bus seen through its passengers, the two airport levels, and a network called TowerWAVPDX.</p><span class="go">Run 2 →</span></a>
   <a class="sh-card" href="#both"><div class="ey">Both runs</div><h3>What two days settle</h3><p>The runs side by side, what was heard on both days, and what to change before run 3.</p><span class="go">Both runs →</span></a>
  </div>
  <h2>The first week</h2>
  <p id="wk"></p>
  <footer>Street map © OpenStreetMap contributors, bundled along the driven roads.</footer>`);
  Promise.all([getJ('data/pdx/summary.json'),getJ('data/pdx/tracks.json'),getJ('data/ft/run1.json'),getJ('data/ft/run2.json')]).then(([S,T,r1,r2])=>{const t=S.totals;
    d.querySelector('#pst').innerHTML=[[fmt(t.wifi_devices),'Wi-Fi networks, first week'],[fmt(t.ble_devices),'Bluetooth addresses, first week'],[t.lora_nodes,'LoRa nodes, first week'],['2','field-test runs'],['149 km','driven on run 2']].map(x=>'<div><b>'+x[0]+'</b><span>'+x[1]+'</span></div>').join('');
    d.querySelector('#wk').innerHTML=`${t.files} sessions on ${t.days} days between ${day(t.first)} and ${day(t.last)}, all on the T-Deck Plus: ${fmt(t.rows)} rows after the privacy cut, ${fmt(t.wifi_devices)} Wi-Fi networks and ${fmt(t.ble_devices)} Bluetooth addresses. The busiest Wi-Fi was on the commercial strips of Tigard and Tanasbourne. The driving that week was light, so it is summarised here rather than given the full Los Angeles treatment; the field tests below it carry the detailed Portland analysis.`;
    if(!window.L)return;
    lmap=L.map('shmap',{minZoom:11,maxZoom:15,scrollWheelZoom:false,attributionControl:true}).setView([45.5,-122.75],11);lmap.attributionControl.setPrefix(false);
    L.tileLayer('t/{z}/{x}/{y}.jpg',{tileSize:1024,zoomOffset:-2,minZoom:11,maxZoom:15,attribution:'© OpenStreetMap contributors'}).addTo(lmap);
    const cs=getComputedStyle(document.documentElement),c=k=>cs.getPropertyValue(k).trim();const all=[];
    T.forEach(seg=>{L.polyline(seg,{color:c('--sh-ink3'),weight:2.5,opacity:.85}).addTo(lmap);all.push(...seg);});
    const brk=(tr)=>{const out=[];let s=[];tr.forEach((p,i)=>{if(i&&p[0]-tr[i-1][0]>1.5){if(s.length>1)out.push(s);s=[];}s.push([p[1],p[2]]);});if(s.length>1)out.push(s);return out;};
    brk(r1.track).forEach(s=>{L.polyline(s,{color:c('--sh-acc'),weight:3}).addTo(lmap);all.push(...s);});
    brk(r2.track).forEach(s=>{L.polyline(s,{color:c('--sh-acc2'),weight:3}).addTo(lmap);all.push(...s);});
    lmap.fitBounds(L.latLngBounds(all),{padding:[20,20]});lmap.on('click',()=>lmap.scrollWheelZoom.enable());
  }).catch(e=>{d.querySelector('#wk').textContent='The Portland figures did not load ('+e.message+').';});
}
function pageAbout(){
  wrap(`<div class="ey">Method</div><h1>How this site was made</h1>
  <p class="lead">The logs come from handheld ESP32 scanners running Pisces Moon firmware, carried in a car. Each row is one sighting: a radio address, a name if it sent one, a signal strength, a time and a GPS fix.</p>
  <h2>What is withheld</h2>
  <ul><li><b>Two private areas are cut out of the data first,</b> one in each region. Their edges follow the road network, so a track simply stops where the car leaves the public roads. Every row recorded inside those areas was removed before any figure, list or map was built. A row without a GPS fix went with the fix nearest to it in time, and any transmitter that lives inside an area was removed wherever else it was heard.</li>
  <li><b>Home and personal network names are withheld.</b> A name is shown when it belongs to a business, a public service, a product or a fleet, or when the same name turned up in three or more separate places. Everything else is shown as a home or personal device without its name.</li>
  <li><b>Device addresses are shortened</b> to their maker block plus a tag that only means something inside this site. Tesla Bluetooth names, which derive from the car's VIN, are replaced with a tag the same way.</li>
  <li><b>People are fictionalised.</b> The survey car's operator is "the driver"; LoRa node names that could point to a person, such as a call sign, are replaced with invented ones, and strangers' node numbers are invented too. Messages sent from the rig's own LoRa pager are shown exactly as captured.</li>
  <li><b>Police and plate-reader equipment</b> is counted and never listed or mapped.</li></ul>
  <p>Companies, agencies, venues and fleets keep the names they broadcast: TriMet, Alto, Tower, Lime, Best Buy, Safe Fleet, Motive and the rest.</p>
  <h2>How a new drive is added</h2>
  <p>New logs go through the same steps in order: the privacy cut, the split by region, the analysis stages, the name rules, and a leak check that fails the build if a private coordinate, a full device address or a withheld string appears in anything published. The pages are then rebuilt from the output. A new field-test run follows the same route through its own scrub step.</p>
  <h2>Limits</h2>
  <ul><li>The scanners hear 2.4 GHz Wi-Fi, Bluetooth Low Energy and, on some runs, 5 GHz Wi-Fi, LoRa and sub-GHz bursts. Classic Bluetooth and cellular are invisible.</li>
  <li>Positions are where the car was when a signal was strongest, a strength-weighted estimate, not where a device sits.</li>
  <li>Phones rotate their Bluetooth addresses every few minutes, so one phone looks like many devices and cannot be followed by address.</li></ul>
  <footer>Street and neighbourhood names: © OpenStreetMap contributors, via Nominatim. Device makers: IEEE registration authority.</footer>`);
}
go();
